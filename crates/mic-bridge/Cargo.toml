[package]
name = "openstar-mic-bridge"
description = "The OpenStar Mic bridge: reads every channel of an audio interface and joins the Stage through the server."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "openstar-mic-bridge"
path = "src/main.rs"

[dependencies]
openstar-protocol.workspace = true
openstar-detector.workspace = true
openstar-capture-clock.workspace = true
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
futures-util.workspace = true
# The self-update (#209) downloads the server's build over HTTP(S), with the
# same rustls stack (and platform certificate verifier) as the server's
# USDB client, and checks its SHA-256.
reqwest = { workspace = true, features = ["rustls"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }
# `wss://` for a server behind HTTPS; the system's root certificates.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
egui_kittest.workspace = true
image.workspace = true
openstar.workspace = true
openstar-test-harness.workspace = true
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true
