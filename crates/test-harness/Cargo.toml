[package]
name = "openstar-test-harness"
description = "Shared harness for OpenStar's server integration tests: the app in-process, a fake USDB, a yt-dlp stub and ffmpeg media generators."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One test binary, `tests/main.rs`, instead of one per file in `tests/`.
autotests = false

[lints]
workspace = true

[dependencies]
openstar.workspace = true
openstar-protocol.workspace = true
anyhow.workspace = true
axum.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tokio-tungstenite.workspace = true

[dev-dependencies]
futures-util.workspace = true
insta.workspace = true
proptest.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
