[workspace]
resolver = "3"
members = ["crates/detector", "crates/protocol", "crates/server", "crates/test-harness"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
publish = false

# Every crate inherits these with `[lints] workspace = true`. The one planned
# exemption from `unsafe_code = "forbid"` is the `detector-wasm` crate (#50): it
# alone sets its own `[lints]`, and its only `unsafe` is `#[unsafe(no_mangle)]`
# on its exports. No other crate may opt out.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
openstar = { path = "crates/server" }
openstar-protocol = { path = "crates/protocol" }
openstar-test-harness = { path = "crates/test-harness" }
anyhow = "=1.0.105"
axum = { version = "=0.8.9", features = ["ws"] }
chardetng = "=1.0.0"
encoding_rs = "=0.8.44"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
html-escape = "=0.3.1"
icu_casemap = "=2.4.0"
icu_normalizer = "=2.4.0"
insta = { version = "=1.49.0", features = ["json"] }
mime_guess = "=2.0.5"
proptest = "=1.12.0"
regex = "=1.13.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
rust-embed = "=8.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tokio-tungstenite = "=0.30.0"
tower-http = { version = "=0.7.1", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
ts-rs = "=12.0.1"
