<title>OpenStar Phone Screens</title>
<!--
  PROTOTYPE, throwaway. Wayfinder ticket "Phone screens" (Marcowich0/OpenStar#21).
  Three takes on everything a Phone shows: joining, the Remote, and the mic screen while in the Line-up.
    A  Tabs         : bottom tab bar (Songs, Queue, Stage, People); the mic takes over the whole screen.
    B  One scroll   : one home page ordered by urgency, a thumb-height "Add a song" button; the mic is a bar.
    C  Thumb deck   : a Stage mirror on top, a cover carousel and a dock at the bottom; the mic is a dark pocket screen.
  Location: #<variant>-<scene>, e.g. #b-mic-singing. Keys (desktop): left/right arrow switches the take.
  All data is invented and in memory. No real mic, no server. Palette colours 9-12 are placeholders
  until the "Twelve-colour palette" ticket settles them.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a 390x844 Phone on a desk (wide), or the Phone UI filling the screen (narrow, on a real phone). Single light look by choice: Bubble Pop. */
:root{
  --cream:#FFF6E9;--cream2:#FFE7CC;--ink:#2B2D42;--ink2:#5d6079;--mute:#8a8ca0;--white:#fff;
  --line:rgba(43,45,66,.12);--ledge:rgba(43,45,66,.14);--desk:#EADFCF;
  --red:#FF4B5C;--blue:#2EA8FF;--green:#3DDC84;--yellow:#FFC93C;--purple:#9B5CFF;
  --pocket:#16161f;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --font:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- desk + device ---------- */
#desk{height:100%;display:grid;grid-template-columns:300px auto;justify-content:center;align-items:center;gap:40px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:16px 76px}
#device{position:relative;width:390px;height:min(844px,calc(100vh - 110px));border-radius:56px;border:12px solid #1d1e2c;box-shadow:0 24px 60px rgba(43,45,66,.35);overflow:hidden;background:var(--cream)}
#app{position:absolute;inset:0;overflow:hidden;background:var(--cream)}
@media (max-width:760px){
  body{background:var(--cream)}
  #desk{display:block;padding:0}
  #device{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  #panel{display:none}
  #panel.open{display:block;position:fixed;inset:auto 0 0 0;max-height:75%;overflow:auto;z-index:60;border-radius:24px 24px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  #bar{display:none}
  #protoBtn{display:flex}
}

/* ---------- prototype chrome (not part of the design) ---------- */
#panel{background:#16161f;color:#e9e9f2;border-radius:20px;padding:16px;font:13px/1.45 system-ui,sans-serif;max-height:calc(100vh - 120px);overflow:auto}
#panel h2{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#9a9ab0;margin:14px 0 6px}
#panel h2:first-child{margin-top:0}
#panel .vrow{display:flex;gap:6px}
#panel .vrow button{flex:1;padding:8px 4px;border-radius:10px;background:#262634;font:600 12px/1.2 system-ui;color:#e9e9f2}
#panel .vrow button.on{background:#fff;color:#111}
#panel .scenes{display:flex;flex-direction:column;gap:2px}
#panel .scenes button{text-align:left;padding:5px 8px;border-radius:8px;color:#cfcfe0;font:13px/1.3 system-ui}
#panel .scenes button:hover{background:#262634}
#panel .scenes button.on{background:#2EA8FF;color:#fff}
#panel .ev{display:flex;flex-wrap:wrap;gap:6px}
#panel .ev button{padding:6px 9px;border-radius:8px;background:#262634;color:#e9e9f2;font:12px/1.2 system-ui}
#panel .ev button:hover{background:#34344a}
#panel p.note{margin:6px 0 0;color:#b9b9cc}
#panel .state{font:11px/1.45 var(--mono);color:#9fe3b9;white-space:pre-wrap;background:#0d0d13;border-radius:10px;padding:8px;margin-top:6px}
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;background:#111;color:#fff;border-radius:999px;font:600 13px/1 var(--mono);box-shadow:0 6px 24px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.15);z-index:50}
#bar button{color:#fff;padding:9px 12px;border-radius:999px}
#bar button:hover{background:#2a2a2a}
#bar .lbl{min-width:190px;text-align:center}
#protoBtn{display:none;position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:55;align-items:center;gap:6px;background:#111;color:#fff;font:600 11px/1 var(--mono);padding:7px 10px;border-radius:999px;opacity:.8}

/* ---------- shared Bubble Pop parts ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(circle at 15% 0%,#fff 0,var(--cream) 45%,var(--cream2) 100%)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding:0 18px}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px}
@media (min-width:761px){.top{padding-top:44px}}
.logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:22px}
.logo svg{width:26px;height:26px}
.sub{font-size:13px;color:var(--mute);font-weight:500}
.h1{font-size:30px;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
.h2{font-size:20px;font-weight:700;margin:0}
.muted{color:var(--ink2)}
.av{--s:44px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--pc);display:inline-flex;align-items:center;justify-content:center;border:calc(var(--s)*.07) solid #fff;box-shadow:0 3px 0 var(--ledge)}
.av svg{width:56%;height:56%;fill:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 26px;border-radius:999px;font-weight:600;font-size:19px;background:var(--white);box-shadow:0 6px 0 var(--ledge);transition:transform .2s var(--spring)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ledge)}
.btn.go{background:var(--green);color:#fff;box-shadow:0 6px 0 #24A862}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 6px 0 #1b7fc4}
.btn.red{background:var(--red);color:#fff;box-shadow:0 6px 0 #C7303F}
.btn.ink{background:var(--ink);color:#fff;box-shadow:0 6px 0 #14151f}
.btn.wide{width:100%}
.btn.sm{min-height:44px;font-size:16px;padding:0 18px}
.btn.breathe{animation:breathe 1.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:#fff;font-size:14px;font-weight:600;box-shadow:0 3px 0 var(--ledge);white-space:nowrap}
.chip.duet{background:var(--purple);color:#fff}
.chip.best{background:var(--yellow)}
.chip.on{background:var(--ink);color:#fff}
.card{background:#fff;border-radius:28px;box-shadow:0 7px 0 var(--ledge);padding:16px}
.cover{flex:none;border-radius:16px;border:3px solid #fff;box-shadow:0 4px 0 var(--ledge);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--c1),var(--c2));text-shadow:0 2px 0 rgba(0,0,0,.15)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t{font-weight:600;font-size:17px;line-height:1.2}
.a{font-size:14px;color:var(--ink2);line-height:1.2}
.round{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 4px 0 var(--ledge);flex:none}
.round svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.round.go{background:var(--green);color:#fff;box-shadow:0 4px 0 #24A862}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.avs{display:flex}.avs .av{margin-left:-8px}.avs .av:first-child{margin-left:0}
.pop{animation:pop .45s var(--spring)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.slideup{animation:slideup .45s var(--spring)}
@keyframes slideup{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
.sec{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:0 18px;height:52px;box-shadow:inset 0 3px 0 rgba(0,0,0,.05),0 0 0 2px var(--line)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:17px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.hold{position:relative;overflow:hidden}
.hold::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.35);transform:scaleX(0);transform-origin:left}
.hold.holding::after{transform:scaleX(1);transition:transform .7s linear}
.holdhint{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
.lv{height:12px;border-radius:9px;background:rgba(43,45,66,.12);overflow:hidden}
.lv i{display:block;height:100%;width:calc(var(--lv,0)*100%);background:var(--pc,var(--green));border-radius:9px;transition:width .12s}
.prog{height:8px;border-radius:9px;background:rgba(43,45,66,.12);overflow:hidden}
.prog i{display:block;height:100%;background:var(--yellow);border-radius:9px}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--cream2);color:var(--ink2)}
.tag.warn{background:#FFE1E4;color:#B3192B}

/* sheet */
.veil{position:absolute;inset:0;background:rgba(43,45,66,.35);z-index:20;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--cream);border-radius:32px 32px 0 0;box-shadow:0 -6px 0 var(--ledge);max-height:88%;display:flex;flex-direction:column;animation:sheetin .45s var(--spring)}
@keyframes sheetin{from{transform:translateY(100%)}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:rgba(43,45,66,.2);margin:10px auto 4px}
.sheet .body{padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;background:#fff;box-shadow:0 4px 0 var(--ledge);font-size:17px;font-weight:600;text-align:left;margin-bottom:10px;min-height:56px}
.opt.on{box-shadow:0 0 0 3px var(--ink),0 4px 0 var(--ledge)}
.opt.off{opacity:.45}
.opt .ico{color:var(--ink2)}
.seg{display:flex;background:rgba(43,45,66,.08);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:999px;font-weight:600;font-size:15px}
.seg button.on{background:#fff;box-shadow:0 3px 0 var(--ledge)}

/* toast */
#toasts{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;display:flex;flex-direction:column;gap:6px;pointer-events:none}
@media (min-width:761px){#toasts{top:40px}}
.toast{background:var(--ink);color:#fff;border-radius:999px;padding:10px 16px;font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px;animation:pop .4s var(--spring);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.toast .av{--s:24px;box-shadow:none}

/* numpad */
.code{display:flex;gap:10px;justify-content:center}
.code b{width:62px;height:76px;border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--ledge);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700}
.code b.cur{box-shadow:0 0 0 3px var(--blue),0 5px 0 var(--ledge)}
.code.bad b{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pad3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad3 button{height:64px;border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--ledge);font-size:28px;font-weight:600}
.pad3 button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ledge)}

/* colour + avatar grids */
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.cdot{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--pc);border:4px solid #fff;box-shadow:0 3px 0 var(--ledge);position:relative}
.cdot.on{box-shadow:0 0 0 3px var(--ink),0 3px 0 var(--ledge)}
.cdot.taken{opacity:.28}
.cdot.taken::after{content:"";position:absolute;left:50%;top:10%;bottom:10%;width:3px;background:var(--ink);transform:rotate(45deg)}
.agrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.agrid button{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 3px 0 var(--ledge)}
.agrid button svg{width:55%;height:55%;fill:var(--ink)}
.agrid button.on{background:var(--pc)}
.agrid button.on svg{fill:#fff}
.field{width:100%;height:56px;border-radius:20px;border:0;background:#fff;padding:0 18px;font-size:19px;box-shadow:inset 0 3px 0 rgba(0,0,0,.05),0 0 0 2px var(--line);outline:0}
.field:focus{box-shadow:0 0 0 3px var(--blue)}

/* ---------- A: tabs ---------- */
.tabbar{display:flex;background:#fff;box-shadow:0 -4px 0 var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
@media (min-width:761px){.tabbar{padding-bottom:22px}}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--mute);border-radius:18px;position:relative}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .ico{color:var(--red);transform:scale(1.15)}
.tabbar .ico{width:26px;height:26px;transition:transform .3s var(--spring)}
.tabbar .badge{position:absolute;top:0;left:56%;background:var(--red);color:#fff;font-size:11px;border-radius:999px;padding:1px 6px}
.mini{margin:0 10px 8px;background:var(--ink);color:#fff;border-radius:22px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:10px}
.mini .round{width:44px;height:44px;background:#fff;color:var(--ink);box-shadow:none}
.qcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:24px;background:#fff;box-shadow:0 5px 0 var(--ledge);margin-bottom:12px;width:100%;text-align:left}
.qcard.head{box-shadow:0 0 0 3px var(--yellow),0 5px 0 var(--ledge)}
.qnum{width:28px;font-weight:700;font-size:20px;color:var(--mute);text-align:center;flex:none}

/* mic takeover (A) */
.mic{position:absolute;inset:0;z-index:15;background:var(--pc);color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(30px + env(safe-area-inset-top,0px)) 22px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:761px){.mic{padding-top:56px;padding-bottom:26px}}
.mic::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.mic>*{position:relative}
.ring{position:relative;width:200px;height:200px;margin:18px 0 10px;display:flex;align-items:center;justify-content:center}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.28);transform:scale(calc(.72 + var(--lv,0)*.4));transition:transform .12s}
.ring .av{--s:150px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.mic .h1{color:#fff}
.mic .wpill{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.mic .wpill .chip{background:rgba(255,255,255,.25);color:#fff;box-shadow:none;font-size:15px;padding:7px 14px}
.mic .note{font-size:15px;opacity:.92;max-width:300px;line-height:1.35}
.mic .prog{background:rgba(255,255,255,.3);width:100%}.mic .prog i{background:#fff}
.mic .btn{color:var(--ink)}
.backbar{display:flex;align-items:center;gap:10px;background:var(--pc);color:#fff;padding:10px 14px;border-radius:22px;margin:0 10px 6px;font-weight:600}

/* ---------- B: one scroll ---------- */
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:12}
@media (min-width:761px){.fab{bottom:28px}}
.fab .btn{white-space:nowrap;min-height:64px;font-size:21px;padding:0 30px;background:var(--red);color:#fff;box-shadow:0 7px 0 #C7303F}
.now{border-radius:32px;padding:18px;color:#fff;background:var(--ink);box-shadow:0 8px 0 rgba(43,45,66,.25)}
.now .a{color:rgba(255,255,255,.7)}
.now .prog{background:rgba(255,255,255,.2)}
.now .btn{color:var(--ink)}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ctl button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:20px;background:rgba(255,255,255,.12);font-size:12px;font-weight:600;color:#fff}
.ctl button .ico{width:26px;height:26px}
.ctl button.big{background:#fff;color:var(--ink)}
.slot{display:flex;align-items:center;gap:10px;padding:10px;border-radius:20px;background:rgba(255,255,255,.1);width:100%;text-align:left;margin-bottom:8px;color:inherit}
.slot .tag{background:rgba(255,255,255,.18);color:#fff}
.slot .tag.warn{background:#FFE1E4;color:#B3192B}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:2px solid var(--line);width:100%;text-align:left}
.lrow:last-child{border-bottom:0}
.micbar{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:13;border-radius:28px;background:var(--pc);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 7px 0 rgba(43,45,66,.25);text-align:left;width:auto}
@media (min-width:761px){.micbar{bottom:22px}}
.micbar .lv{background:rgba(255,255,255,.3);flex:1}.micbar .lv i{background:#fff}
.micbar .av{--s:46px}
.lib{position:absolute;inset:0;z-index:18;background:var(--cream);display:flex;flex-direction:column;animation:sheetin .4s var(--spring)}
.lib .foot{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;box-shadow:0 -4px 0 var(--line)}
@media (min-width:761px){.lib .foot{padding-bottom:24px}}
.scrub{position:absolute;right:4px;top:120px;bottom:150px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-weight:700;color:var(--mute);text-align:center;width:18px}

/* ---------- C: thumb deck ---------- */
.mirror{margin:0 14px;border-radius:30px;background:var(--ink);color:#fff;padding:16px;position:relative;overflow:hidden}
.mirror::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}
.mirror .a{color:rgba(255,255,255,.7)}
.mirror .prog{background:rgba(255,255,255,.2)}
.dock{display:flex;gap:8px;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;box-shadow:0 -4px 0 var(--line)}
@media (min-width:761px){.dock{padding-bottom:24px}}
.dock button{flex:1;min-height:56px;border-radius:20px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mute)}
.dock button.on{background:var(--ink);color:#fff}
.carousel{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px calc(50% - 105px);scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .cover{width:210px;height:210px;border-radius:40px;border-width:7px;font-size:64px;scroll-snap-align:center;transition:transform .4s var(--spring)}
.carousel .cover:not(.sel){transform:scale(.82);opacity:.75}
.carousel .cover.sel{animation:squish .6s var(--spring)}
@keyframes squish{0%{transform:scale(.88,1.1)}45%{transform:scale(1.06,.94)}100%{transform:none}}
.pocket{position:absolute;inset:0;z-index:15;background:var(--pocket);color:#fff;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:761px){.pocket{padding-top:50px;padding-bottom:30px}}
.pocket .glow{position:absolute;left:50%;top:44%;width:320px;height:320px;margin:-160px;border-radius:50%;background:radial-gradient(circle,var(--pc),transparent 68%);opacity:calc(.25 + var(--lv,0)*.6);transition:opacity .12s;pointer-events:none}
.pocket>*{position:relative}
.pocket .lyric{font-size:34px;font-weight:700;line-height:1.15;text-wrap:balance}

<div id="desk">

  <div id="device"><div id="app"></div></div>
</div>
<div id="bar"><button data-proto="prev" aria-label="Previous take">&larr;</button><span class="lbl" id="barLbl"></span><button data-proto="next" aria-label="Next take">&rarr;</button></div>
<button id="protoBtn" data-proto="panel">PROTO <span id="protoLbl"></span></button>

<script>
/* ================= data ================= */
const PAL=[['red','#FF4B5C'],['blue','#2EA8FF'],['green','#3DDC84'],['amber','#FFB020'],['purple','#9B5CFF'],['pink','#FF6FB5'],['teal','#12BFC4'],['orange','#FF7A1A'],['lime','#8FCB3F'],['indigo','#4F5BD5'],['brown','#B0703C'],['magenta','#C9359B']];
const HEX=Object.fromEntries(PAL);
const AVS={star:'M12 2l3 6.5 7 .9-5.1 4.8 1.3 7L12 17.8 5.8 21.2l1.3-7L2 9.4l7-.9z',heart:'M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z',moon:'M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z',bolt:'M13 2L4 14h7l-1 8 9-12h-7z',note:'M9 18a3 3 0 1 1-2-2.8V5l11-2v11a3 3 0 1 1-2-2.8V6.4l-7 1.3z',crown:'M3 18l-1-11 6 5 4-8 4 8 6-5-1 11z',drop:'M12 2s7 8 7 13a7 7 0 0 1-14 0c0-5 7-13 7-13z',leaf:'M20 4C9 4 4 9 4 16c0 1.5.3 3 1 4 1-5 4-8 9-10-4 3-6 6-7 10 9 1 13-7 13-16z',diamond:'M12 2l9 10-9 10-9-10z',cloud:'M7 19a5 5 0 0 1-.6-10A6 6 0 0 1 18 8.5 4.5 4.5 0 0 1 17.5 19z',flame:'M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z',ghost:'M5 21V11a7 7 0 0 1 14 0v10l-2.3-2-2.3 2-2.4-2-2.3 2-2.4-2z'};
const PROFILES=[
 {id:'bo',name:'Bo',av:'star',fav:'red'},{id:'sara',name:'Sara',av:'ghost',fav:'purple'},{id:'jonas',name:'Jonas',av:'bolt',fav:'green'},
 {id:'mia',name:'Mia',av:'moon',fav:'red'},{id:'emil',name:'Emil',av:'crown',fav:'amber'},{id:'freja',name:'Freja',av:'leaf',fav:'teal'},
 {id:'ida',name:'Ida',av:'heart',fav:'pink'},{id:'noah',name:'Noah',av:'note',fav:'indigo'}];
const SONGS=[
 ['africa','Africa','Toto',1982,0,'Pop rock','4:55',8120],['dq','Dancing Queen','ABBA',1976,0,'Disco','3:51',9010],
 ['shallow','Shallow','Lady Gaga & Bradley Cooper',2018,1,'Ballad','3:36',0],['brightside','Mr. Brightside','The Killers',2004,0,'Rock','3:43',6540],
 ['valerie','Valerie','Amy Winehouse',2007,0,'Soul','3:53',0],['islands','Islands in the Stream','Dolly Parton & Kenny Rogers',1983,1,'Country','4:10',7300],
 ['wannabe','Wannabe','Spice Girls',1996,0,'Pop','2:53',0],['takeonme','Take On Me','a-ha',1985,0,'Synth-pop','3:46',5980],
 ['rolling','Rolling in the Deep','Adele',2010,0,'Soul','3:48',0],['dgbmh',"Don't Go Breaking My Heart",'Elton John & Kiki Dee',1976,1,'Pop','4:33',0],
 ['prayer',"Livin' on a Prayer",'Bon Jovi',1986,0,'Rock','4:09',7710],['eclipse','Total Eclipse of the Heart','Bonnie Tyler',1983,0,'Ballad','4:29',0],
 ['bohemian','Bohemian Rhapsody','Queen',1975,0,'Rock','5:55',6020],['iwiitw','I Want It That Way','Backstreet Boys',1999,0,'Pop','3:33',0],
 ['somebody','Somebody That I Used to Know','Gotye & Kimbra',2011,1,'Indie','4:04',0],['dsmn',"Don't Stop Me Now",'Queen',1978,0,'Rock','3:29',8800]
].map(([id,title,artist,year,duet,genre,len,best],i)=>({id,title,artist,year,duet:!!duet,genre,len,best,c1:PAL[i%12][1],c2:PAL[(i*5+3)%12][1]}));
const SONG=Object.fromEntries(SONGS.map(s=>[s.id,s]));
const LYR=[['Sing the ','words',' that scroll'],['along the ','bottom',' of the screen'],['and hold the ','long',' notes out'],['until the ','line',' turns gold']];

/* ================= state ================= */
let S;
const ME_PHONE='phone:me';
function base(){
  return {
    variant:S?S.variant:'a', scene:'remote-library',
    joined:true, joinVia:'qr', joinStep:null, code:'', codeBad:false, remembered:'bo',
    pickIdx:0, guest:{name:'',color:null,av:'cloud'}, takenNote:null,
    me:'bo',
    members:[
      {id:'bo',kind:'profile',color:'red',phone:true},
      {id:'sara',kind:'profile',color:'purple',phone:true},
      {id:'jonas',kind:'profile',color:'green',phone:true},
      {id:'g-lukas',kind:'guest',name:'Lukas',av:'flame',color:'orange',phone:true},
      {id:'mia',kind:'profile',color:'blue',phone:false}],
    queue:[
      {id:1,song:'africa',singers:['bo','mia'],by:'bo'},
      {id:2,song:'shallow',singers:['sara','jonas'],by:'sara'},
      {id:3,song:'brightside',singers:['g-lukas'],by:'g-lukas'},
      {id:4,song:'dq',singers:[],by:null}],
    stage:'lineup', /* idle | lineup | playing | paused | results */
    lineup:[{who:'bo',mic:ME_PHONE,voice:1,diff:'Medium'},{who:'mia',mic:'local:1',voice:1,diff:'Easy'}],
    t:0, score:0, lv:0,
    mic:'off', /* off | needs-tap | ready | singing | lost | done */
    micRemote:false, pocketCtl:false,
    tab:'songs', q:'', filter:'All', sheet:null, libOpen:false, deck:'pick', sel:0,
    nextId:5, toasts:[]
  };
}
const member=id=>S.members.find(m=>m.id===id);
function person(id){
  const m=member(id);const p=PROFILES.find(p=>p.id===id);
  if(m&&m.kind==='guest')return {id,name:m.name,av:m.av,color:m.color,guest:true};
  if(p)return {id,name:p.name,av:p.av,color:m?m.color:p.fav,fav:p.fav};
  return {id,name:'?',av:'cloud',color:'brown'};
}
const meP=()=>person(S.me);
const head=()=>S.queue[0];
const seatedMe=()=>S.lineup.some(s=>s.mic===ME_PHONE)&&['lineup','playing','paused'].includes(S.stage);
const freeColors=()=>PAL.map(p=>p[0]).filter(c=>!S.members.some(m=>m.color===c));

const SCENES=[
 ['Join',[
  ['join-qr','Scanned the QR, Phone remembers Bo'],['join-code','Typed the address: enter join code'],['join-who','Pick a Profile (nothing remembered)'],
  ['join-guest','Join as a Guest'],['join-taken','Favourite colour taken (Mia)'],['join-full','Party is full'],['join-removed','Removed from the Party']]],
 ['Remote',[
  ['remote-library','Browse the Library'],['remote-song','Add a Request with singers'],['remote-queue','The Queue'],
  ['remote-lineup','Line-up for the next Song'],['remote-playing','Song playing (I am not singing)'],['remote-idle','Empty Queue'],['remote-people','Party people, Leave party']]],
 ['Mic',[
  ['mic-turnon','Seated: tap to turn on the mic'],['mic-ready','Mic on, waiting for Start'],['mic-singing','Singing'],
  ['mic-lost','Back after the screen locked'],['mic-done','Song over, results']]]
];
const VARS={a:'Tabs',b:'One scroll',c:'Thumb deck'};
const VNOTES={
 a:'A familiar app: four tabs at the bottom (Songs, Queue, Stage, People). Joining is a step-by-step wizard. While in the Line-up the mic takes over the whole screen in the Player colour; the Remote opens on top of it.',
 b:'One home page ordered by urgency: what the Stage is doing now, then the Queue, then the people. A big "Add a song" button sits at thumb height and the Library search box is at the bottom of the screen. Joining is one screen. The mic is a coloured bar along the bottom; the Remote stays usable underneath.',
 c:'Everything is in the bottom half. The top is a small mirror of the Stage; below it a cover carousel like the Stage\'s browser, and a dock (Pick, Queue, People). Joining is an avatar carousel. While singing, the Phone goes dark (pocket screen) and shows the current line; tap for controls.'
};

function preset(scene){
  const v=S?S.variant:'a';S=base();S.variant=v;S.scene=scene;
  const P={
   'join-qr':()=>{P['remote-library']();S.joined=false;S.joinStep='who';S.joinVia='qr';S.members=S.members.filter(m=>m.id!=='bo');},
   'join-code':()=>{P['remote-library']();S.joined=false;S.joinStep='code';S.joinVia='typed';S.remembered=null;S.members=S.members.filter(m=>m.id!=='bo');},
   'join-who':()=>{P['remote-library']();S.joined=false;S.joinStep='who';S.remembered=null;S.members=S.members.filter(m=>m.id!=='bo');},
   'join-guest':()=>{P['remote-library']();S.joined=false;S.joinStep='guest';S.remembered=null;S.members=S.members.filter(m=>m.id!=='bo');S.guest={name:'',color:freeColorsAfter(['bo'])[0],av:'cloud'};},
   'join-taken':()=>{P['remote-library']();S.joined=false;S.joinStep='who';S.remembered='mia';S.me='mia';S.members=S.members.filter(m=>m.id!=='mia');S.members.find(m=>m.id==='bo').color='red';},
   'join-full':()=>{P['remote-library']();S.joined=false;S.joinStep='full';S.remembered=null;},
   'join-removed':()=>{P['remote-library']();S.joined=false;S.joinStep='removed';},
   'remote-library':()=>{S.stage='playing';S.t=38;S.lineup=[{who:'sara',mic:'phone:sara',voice:1,diff:'Hard'},{who:'jonas',mic:'phone:jonas',voice:2,diff:'Medium'}];S.queue=[{id:9,song:'shallow',singers:['sara','jonas'],by:'sara'},{id:1,song:'africa',singers:['bo','mia'],by:'bo'},{id:3,song:'brightside',singers:['g-lukas'],by:'g-lukas'},{id:4,song:'dq',singers:[],by:null}];S.tab='songs';},
   'remote-song':()=>{P['remote-library']();S.sheet={k:'song',song:'valerie',singers:['bo']};},
   'remote-queue':()=>{P['remote-library']();S.tab='queue';S.deck='queue';S.queue.push({id:7,song:'takeonme',singers:['bo','g-lukas'],by:'g-lukas'});},
   'remote-lineup':()=>{S.stage='lineup';S.queue[0]={id:1,song:'shallow',singers:['sara','jonas'],by:'sara'};S.queue[1]={id:2,song:'africa',singers:['bo','mia'],by:'bo'};S.lineup=[{who:'sara',mic:'phone:sara',voice:1,diff:'Hard'},{who:'jonas',mic:null,voice:2,diff:'Medium'}];S.tab='stage';},
   'remote-playing':()=>{P['remote-library']();S.tab='stage';},
   'remote-idle':()=>{S.stage='idle';S.queue=[];S.lineup=[];S.tab='stage';},
   'remote-people':()=>{P['remote-library']();S.tab='people';S.deck='people';S.sheet=v==='b'?{k:'people'}:null;},
   'mic-turnon':()=>{S.stage='lineup';S.mic='needs-tap';S.tab='stage';},
   'mic-ready':()=>{S.stage='lineup';S.mic='ready';S.tab='stage';},
   'mic-singing':()=>{S.stage='playing';S.mic='singing';S.t=72;S.score=2140;},
   'mic-lost':()=>{S.stage='playing';S.mic='lost';S.t=131;S.score=3810;},
   'mic-done':()=>{S.stage='results';S.mic='done';S.t=295;S.score=7460;},
  };
  (P[scene]||P['remote-library'])();
  S.sel=Math.max(0,SONGS.findIndex(s=>s.id==='valerie'));
}
function freeColorsAfter(skip){return PAL.map(p=>p[0]).filter(c=>!S.members.some(m=>m.color===c&&!skip.includes(m.id)));}

/* ================= helpers ================= */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const glyph=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${AVS[n]}"/></svg>`;
const av=(p,s=44)=>`<span class="av" style="--pc:${HEX[p.color]};--s:${s}px" title="${esc(p.name)}">${glyph(p.av)}</span>`;
const avId=(id,s)=>av(person(id),s);
const cover=(song,s=56,fs)=>`<span class="cover" style="--c1:${song.c1};--c2:${song.c2};width:${s}px;height:${s}px;font-size:${fs||Math.round(s*.36)}px;border-radius:${Math.round(s*.28)}px">${esc(song.title.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join(''))}</span>`;
const I={
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',tv:'<rect x="3" y="5" width="18" height="12" rx="3"/><path d="M8 21h8"/>',people:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/>',
 pause:'<path d="M8 5v14M16 5v14"/>',play:'<path d="M7 4l13 8-13 8z"/>',skip:'<path d="M5 4l10 8-10 8zM19 5v14"/>',restart:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',stop:'<rect x="5" y="5" width="14" height="14" rx="3"/>',
 up:'<path d="M12 19V5M5 12l7-7 7 7"/>',down:'<path d="M12 5v14M5 12l7 7 7-7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',chev:'<path d="M9 6l6 6-6 6"/>',back:'<path d="M15 6l-6 6 6 6"/>',
 mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',check:'<path d="M5 12l5 5 9-10"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',door:'<path d="M14 3h5v18h-5M10 8l-4 4 4 4M6 12h10"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',top:'<path d="M5 4h14M12 20V9M6 14l6-6 6 6"/>'
};
const ico=(n,cls='ico')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const len=s=>{const [m,x]=s.len.split(':');return +m*60+ +x};
const micName=m=>!m?'No mic':m===ME_PHONE?'This phone':m.startsWith('phone:')?`${person(m.slice(6)).name}'s phone`:`Local mic ${m.slice(6)}`;
function toast(text,who){S.toasts.push({id:Math.random(),text,who});const id=S.toasts.at(-1).id;setTimeout(()=>{S.toasts=S.toasts.filter(t=>t.id!==id);drawToasts();},2600);drawToasts();}
function drawToasts(){const el=document.getElementById('toasts');if(el)el.innerHTML=S.toasts.map(t=>`<div class="toast">${t.who?avId(t.who,24):''}${esc(t.text)}</div>`).join('');}
const nowSong=()=>S.stage==='idle'?null:SONG[head()?.song];
const logo=`<span class="logo"><svg viewBox="0 0 24 24"><path fill="#FFC93C" stroke="#2B2D42" stroke-width="1.6" stroke-linejoin="round" d="${AVS.star}"/></svg>OpenStar</span>`;
const holdBtn=(act,label,icon,cls='btn')=>`<button class="${cls} hold" data-hold="${act}">${icon?ico(icon):''}${label}</button>`;

/* ================= shared sheets ================= */
function sheetSong(){
  const sh=S.sheet,s=SONG[sh.song];
  const opts=S.members.map(m=>{const p=person(m.id),on=sh.singers.includes(m.id);return `<button class="opt ${on?'on':''}" data-act="toggleSinger" data-arg="${m.id}">${av(p,36)}<span class="grow">${esc(p.name)}${m.id===S.me?' <span class="tag">me</span>':''}${p.guest?' <span class="tag">guest</span>':''}</span>${on?ico('check'):''}</button>`}).join('');
  return `<div class="row" style="gap:14px">${cover(s,84)}<div class="grow"><p class="h2" style="font-size:24px">${esc(s.title)}</p><div class="a">${esc(s.artist)}</div>
   <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">${s.duet?'<span class="chip duet">Duet</span>':''}<span class="chip">${s.year}</span><span class="chip">${s.len}</span>${s.best?`<span class="chip best">Best ${s.best.toLocaleString('en')}</span>`:''}</div></div></div>
   <div class="sec">Who sings it? <span style="text-transform:none;letter-spacing:0;font-weight:500">(optional${s.duet?', a duet needs two':''})</span></div>${opts}
   <button class="btn go wide" data-act="addRequest" style="margin-top:6px">${sh.edit?"Save singers":ico("plus")+"Add to the Queue"}</button>
   <p class="sub" style="text-align:center;margin:10px 0 0">${S.queue.length} Requests ahead</p>`;
}
function sheetReq(){
  const r=S.queue.find(q=>q.id===S.sheet.id);if(!r)return '';const s=SONG[r.song],i=S.queue.indexOf(r);
  return `<div class="row">${cover(s,56)}<div class="grow"><div class="t ell">${esc(s.title)}</div><div class="a ell">${esc(s.artist)}</div></div></div>
  <div class="sec">${i===0?'Up next on the Stage':`Number ${i+1} in the Queue`}</div>
  ${i>1?`<button class="opt" data-act="reqMove" data-arg="top">${ico('top')}Play next</button>`:''}
  ${i>1?`<button class="opt" data-act="reqMove" data-arg="up">${ico('up')}Move up</button>`:''}
  ${i>0&&i<S.queue.length-1?`<button class="opt" data-act="reqMove" data-arg="down">${ico('down')}Move down</button>`:''}
  <button class="opt" data-act="reqSingers">${ico('people')}Change singers</button>
  ${i===0&&S.stage!=='lineup'?'':`<button class="opt" data-act="reqRemove" style="color:var(--red)">${ico('x')}Remove from the Queue</button>`}
  ${i===0&&S.stage!=='lineup'?'<p class="sub">It is playing now. Use Skip or End on the Stage controls.</p>':''}`;
}
function sheetSlot(){
  const i=S.sheet.i,sl=S.lineup[i],s=nowSong();
  const usedMic=S.lineup.filter((x,j)=>j!==i).map(x=>x.mic);
  const mics=[...S.members.filter(m=>m.phone).map(m=>m.id==='bo'||m.id===S.me?ME_PHONE:'phone:'+m.id),'local:1','local:2'];
  return `<div class="row">${avId(sl.who,52)}<div class="grow"><div class="h2">${esc(person(sl.who).name)}</div><div class="a">Seat ${i+1} for ${esc(s.title)}</div></div></div>
   <div class="sec">Who</div><div class="row" style="flex-wrap:wrap;gap:8px">${S.members.map(m=>`<button data-act="slotWho" data-arg="${m.id}" style="border-radius:50%;${m.id===sl.who?'outline:3px solid var(--ink);outline-offset:2px':''}">${avId(m.id,46)}</button>`).join('')}</div>
   <div class="sec">Mic</div>${mics.map(m=>`<button class="opt ${m===sl.mic?'on':''} ${usedMic.includes(m)?'off':''}" data-act="slotMic" data-arg="${m}">${ico(m.startsWith('local')?'mic':'phone')}<span class="grow">${micName(m)}</span>${usedMic.includes(m)?'<span class="tag">in use</span>':''}</button>`).join('')}
   ${s.duet?`<div class="sec">Voice</div><div class="seg">${[1,2].map(v=>`<button class="${sl.voice===v?'on':''}" data-act="slotVoice" data-arg="${v}">Voice ${v}</button>`).join('')}</div>`:''}
   <div class="sec">Difficulty</div><div class="seg">${['Easy','Medium','Hard'].map(d=>`<button class="${sl.diff===d?'on':''}" data-act="slotDiff" data-arg="${d}">${d}</button>`).join('')}</div>
   <button class="btn wide" style="margin-top:18px;color:var(--red)" data-act="slotRemove">Take ${esc(person(sl.who).name)} off this Song</button>`;
}
function sheetPeople(){
  const seated=S.lineup.map(l=>l.who);
  return `<div class="h2">Party people <span class="sub">${S.members.length} of 12</span></div><p class="sub" style="margin:4px 0 12px">Removing someone frees their colour. Join code <b>4821</b>.</p>
  ${S.members.map(m=>{const p=person(m.id);const inL=seated.includes(m.id)&&S.stage!=='idle';return `<div class="opt">${av(p,40)}<span class="grow">${esc(p.name)} ${m.id===S.me?'<span class="tag">me</span>':''}${p.guest?'<span class="tag">guest</span>':''}<br><span class="sub">${m.phone?'On a Phone':'Local mic only'}${p.fav&&p.fav!==p.color?` · favourite ${p.fav} is taken`:''}</span></span>${m.id===S.me?'':inL?'<span class="tag">singing</span>':`<button class="round" style="width:40px;height:40px" data-act="removeMember" data-arg="${m.id}" aria-label="Remove ${esc(p.name)}">${ico('x')}</button>`}</div>`}).join('')}
  <button class="btn wide" style="margin-top:8px" data-act="leave">${ico('door')}Leave party</button>`;
}
function sheetMe(){
  const p=meP();
  return `<div class="row">${av(p,64)}<div class="grow"><div class="h2" style="font-size:26px">${esc(p.name)}</div><div class="a">${p.guest?'Guest for tonight':'Profile'} · ${p.color}</div></div></div>
  <div class="sec">My Difficulty for the next Song</div><div class="seg">${['Easy','Medium','Hard'].map(d=>`<button class="${d==='Medium'?'on':''}">${d}</button>`).join('')}</div>
  <div class="sec">This phone</div>
  <button class="opt" data-act="switchMe">${ico('people')}Someone else is using this phone</button>
  <button class="opt" data-act="editMe">${ico('edit')}Change name, look or colour</button>
  <button class="opt" data-act="leave">${ico('door')}Leave party</button>`;
}
function sheets(){
  if(!S.sheet)return '';
  const k=S.sheet.k;
  const body=k==='song'?sheetSong():k==='req'?sheetReq():k==='slot'?sheetSlot():k==='people'?sheetPeople():k==='me'?sheetMe():k==='confirm'?sheetConfirm():'';

  openLib:()=>{S.libOpen=true;S.sheet=null;}, closeLib:()=>{S.libOpen=false;},
  searchC:()=>{S.searchC=!S.searchC;if(!S.searchC){S.q='';}setTimeout(()=>document.getElementById('q')?.focus(),50);},
  micOn:()=>{S.mic=S.stage==='playing'?'singing':'ready';try{navigator.wakeLock?.request('screen').catch(()=>{})}catch(e){}toast('Mic on. Screen stays on',S.me);},
  micBack:()=>{S.mic='singing';toast('Back in. Scoring again',S.me);},
  micDone:()=>{S.mic='off';S.micRemote=false;A.nextUp();},
  micRemote:()=>{S.micRemote=!S.micRemote;S.sheet=null;},
  pocketTap:()=>{S.pocketCtl=true;clearTimeout(A._pt);A._pt=setTimeout(()=>{S.pocketCtl=false;render();},6000);},
  digit:a=>{S.codeBad=false;if(a==='del')S.code=S.code.slice(0,-1);else if(S.code.length<4)S.code+=a;if(S.code.length===4){if(S.code==='4821'){S.joinStep='who';}else{S.codeBad=true;S.code='';}}},
  toCode:()=>{S.joinStep='code';S.joinVia='typed';S.code='';},
  showAll:()=>{S.showAll=true;}, toGuest:()=>{S.joinStep='guest';S.guest={name:'',color:freeColorsAfter(['bo'])[0],av:Object.keys(AVS)[Math.floor(Math.random()*12)]};},
  joinBack:()=>{S.joinStep='who';},
  gColor:a=>{S.guest.color=a;}, gAv:a=>{S.guest.av=a;},
  joinGuest:()=>{const g=S.guest,n=g.name.trim();if(!n){toast('Type a name first');return;}if(PROFILES.some(p=>p.name.toLowerCase()===n.toLowerCase()))return;const id='g-'+n.toLowerCase();S.members=S.members.filter(m=>m.id!=='bo');S.members.push({id,kind:'guest',name:n,av:g.av,color:g.color,phone:true});S.me=id;S.joined=true;S.joinStep=null;S.lineup=S.lineup.filter(l=>l.mic!==ME_PHONE);S.mic='off';toast(`Welcome, ${n}!`,id);},
  pickProfile:a=>{
    const p=PROFILES.find(x=>x.id===a);let m=member(a);let note=null;
    if(!m){const holder=S.members.find(x=>x.color===p.fav);const col=holder?freeColors()[0]:p.fav;if(!col){S.joinStep='full';return;}m={id:a,kind:'profile',color:col,phone:true};S.members.push(m);if(holder)note={fav:p.fav,got:col,holder:holder.id};}
    else m.phone=true;
    S.me=a;S.remembered=a;S.joined=true;S.showAll=false;
    if(!S.lineup.some(l=>l.who===a))S.mic='off';
    else S.lineup.forEach(l=>{if(l.who===a&&!l.mic?.startsWith('local'))l.mic=ME_PHONE});
    if(note){if(S.variant==='b'){S.joinStep=null;toast(`${p.fav} is taken by ${person(note.holder).name}. You're ${note.got} tonight`,a);}else{S.joinStep='taken';S.takenNote=note;}}
    else{S.joinStep=null;toast(`Welcome back, ${p.name}!`,a);}
  },
  takenOk:()=>{S.joinStep=null;S.takenNote=null;},
  retryFull:()=>{toast('Still full: 12 of 12');},
};

/* ================= events ================= */
document.addEventListener('click',e=>{
  const pr=e.target.closest('[data-proto]');if(pr){proto(pr.dataset.proto,pr.dataset.arg);return;}
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  if(t.closest('#app')){const fn=A[t.dataset.act];if(fn){fn(t.dataset.arg,t,e);render();}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;S.sel=0;render();}
  if(e.target.id==='guestName'){S.guest.name=e.target.value;render();}
  if(e.target.id==='codeIn'){S.code=e.target.value.replace(/\D/g,'').slice(0,4);S.codeBad=S.code.length===4&&S.code!=='4821';render();}
});
let holdT;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-hold]');if(!h)return;h.classList.add('holding');holdT=setTimeout(()=>{h.classList.remove('holding');const [act,arg]=h.dataset.hold.split(':');A[act]?.(arg);render();},700);});
['pointerup','pointerleave','pointercancel'].forEach(ev=>document.addEventListener(ev,e=>{const h=e.target.closest&&e.target.closest('[data-hold]');if(h)h.classList.remove('holding');clearTimeout(holdT);},true));
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowRight')proto('next');if(e.key==='ArrowLeft')proto('prev');});

/* live tick: song time, level meter, score (updates in place, no re-render) */
let lvT=0;
function tick(once){
  if(!once){
    if(S.stage==='playing'){S.t+=.25;const s=nowSong();if(s&&S.t>=len(s)){S.t=len(s);}if(S.mic==='singing')S.score=Math.min(10000,S.score+Math.round(Math.random()*9));}
    lvT+=.25;S.lv=(S.mic==='ready'||S.mic==='singing')?Math.max(0,Math.min(1,.45+.4*Math.sin(lvT*2.3)+.25*(Math.random()-.5))):0;
  }
  const s=nowSong();
  document.querySelectorAll('.js-prog').forEach(e=>{if(s)e.style.width=(S.t/len(s)*100)+'%'});
  document.querySelectorAll('.js-time').forEach(e=>e.textContent=fmt(S.t));
  document.querySelectorAll('.js-lv').forEach(e=>e.parentElement.style.setProperty('--lv',S.lv));
  document.querySelectorAll('.js-ring').forEach(e=>e.style.setProperty('--lv',S.lv));
  if(S.mic==='singing')document.querySelectorAll('.js-score').forEach(e=>e.textContent=S.score.toLocaleString('en'));
}
setInterval(()=>tick(false),250);

/* ================= prototype chrome ================= */
function proto(cmd,arg){
  const ks=Object.keys(VARS);
  if(cmd==='next'||cmd==='prev'){const i=ks.indexOf(S.variant);S.variant=ks[(i+(cmd==='next'?1:ks.length-1))%ks.length];preset(S.scene);render();}
  if(cmd==='v'){S.variant=arg;preset(S.scene);render();}
  if(cmd==='scene'){preset(arg);render();document.getElementById('panel').classList.remove('open');}
  if(cmd==='panel'){document.getElementById('panel').classList.toggle('open');}
  if(cmd==='ev'){
    if(arg==='seat'){if(S.stage==='playing'||S.stage==='paused'){toast('Not mid-song: wait for the next Line-up');return;}if(S.stage==='idle'||S.stage==='results'){preset('mic-turnon');}else{S.lineup=S.lineup.filter(l=>l.who!==S.me);S.lineup.unshift({who:S.me,mic:ME_PHONE,voice:1,diff:'Medium'});S.mic='needs-tap';toast('Sara put you in the Line-up','sara');}}
    if(arg==='start'){if(S.stage==='lineup'){S.stage='playing';S.t=0;S.score=0;if(S.mic==='ready')S.mic='singing';toast('Sara pressed Start','sara');}}
    if(arg==='lock'){if(S.mic==='singing'){S.mic='lost';S.t+=8;toast('(Phone was locked for 8 s)');}else toast('Only matters while singing');}
    if(arg==='end'){if(S.stage==='playing'){S.stage='results';if(S.mic==='singing'||S.mic==='lost')S.mic='done';S.t=nowSong()?len(nowSong()):0;}}
    if(arg==='other'){toast('Jonas moved Valerie up','jonas');}
    render();
  }
}
function drawPanel(){
  const p=document.getElementById('panel');
  const st={me:meP().name+' ('+meP().color+')',joined:S.joined,stage:S.stage,mic:S.mic,queue:S.queue.map(q=>SONG[q.song].title),lineup:S.lineup.map(l=>`${person(l.who).name} · ${micName(l.mic)} · V${l.voice} · ${l.diff}`)};
  p.innerHTML=`<h2>Take</h2><div class="vrow">${Object.entries(VARS).map(([k,n])=>`<button class="${S.variant===k?'on':''}" data-proto="v" data-arg="${k}">${k.toUpperCase()} ${n}</button>`).join('')}</div><p class="note">${VNOTES[S.variant]}</p>
  ${SCENES.map(([g,l])=>`<h2>${g}</h2><div class="scenes">${l.map(([id,lab])=>`<button class="${S.scene===id?'on':''}" data-proto="scene" data-arg="${id}">${lab}</button>`).join('')}</div>`).join('')}
  <h2>Things that happen elsewhere</h2><div class="ev"><button data-proto="ev" data-arg="seat">Stage seats me</button><button data-proto="ev" data-arg="start">Someone presses Start</button><button data-proto="ev" data-arg="lock">Phone locks mid-song</button><button data-proto="ev" data-arg="end">Song ends</button><button data-proto="ev" data-arg="other">Another Remote acts</button></div>
  <h2>State</h2><div class="state">${esc(JSON.stringify(st,null,1).replace(/[{}"]/g,'').replace(/^\n|\n$/g,''))}</div>`;
  document.getElementById('barLbl').textContent=`${S.variant.toUpperCase()} (${VARS[S.variant]})`;
  document.getElementById('protoLbl').textContent=`${S.variant.toUpperCase()} · ${S.scene}`;
}
function fromHash(){
  const h=location.hash.slice(1);const m=h.match(/^([abc])-(.+)$/);
  S=null;preset('remote-library');
  if(m){S.variant=m[1];if(SCENES.some(([,l])=>l.some(([id])=>id===m[2])))preset(m[2]);}
  render();
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==`${S.variant}-${S.scene}`)fromHash();});
fromHash();
</script>
