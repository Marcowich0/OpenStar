<!doctype html>
<!--
  PROTOTYPE, throwaway. Wayfinder ticket "Stage screens" (Marcowich0/OpenStar#28).
  Three takes on the Stage's own screens beyond the song browser and the sing screen:
  idle, Line-up, results, Party people list, toasts, "Stage moved here", and the mic lost marker on a lane.
    A  Tabs on the TV : the Phone's four tabs (Songs, Queue, Stage, People) as a top bar; each is a full page.
    B  Big moments    : no chrome; one full-screen scene per state, Queue and People as overlays (Q, P).
    C  Side rail      : a fixed right rail (join QR, Queue, People, activity feed) beside the main screen.
  Everything is driven by the keyboard (arrows move focus, Enter picks, Esc backs out, hold Enter to confirm)
  and by the mouse (hover focuses, click picks, press and hold to confirm), and Remotes act on it through the
  "Remote does..." events in the panel.
  Prototype keys: [ and ] switch the take, ` (backtick) opens the scene panel. Location: #<take>-<scene>.
  All data is invented and in memory. No real mic, server, video or audio.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenStar Stage Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF6E9;--cream2:#FFE7CC;--ink:#2B2D42;--ink2:#5d6079;--mute:#8a8ca0;
  --ledge:rgba(43,45,66,.14);--line:rgba(43,45,66,.12);
  --red:#FF4B5C;--blue:#2EA8FF;--green:#3DDC84;--yellow:#FFC93C;--purple:#9B5CFF;--slate:#7C82A0;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --font:'Fredoka',ui-rounded,system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0d12}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform-origin:center center;font-family:var(--font);color:var(--ink);background:var(--cream)}
#scr{position:absolute;inset:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- prototype chrome (not part of the design) ---------- */
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;background:#111;color:#fff;border-radius:999px;font:600 13px/1 var(--mono);box-shadow:0 6px 24px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.15);z-index:90}
#bar button{color:#fff;padding:9px 12px;border-radius:999px;font:inherit}
#bar button:hover{background:#2a2a2a}
#bar .lbl{min-width:230px;text-align:center}
#panel{position:fixed;left:12px;top:12px;bottom:70px;width:300px;background:#16161f;color:#e9e9f2;border-radius:18px;padding:14px;font:13px/1.45 system-ui,sans-serif;overflow:auto;z-index:91;box-shadow:0 10px 40px rgba(0,0,0,.5);display:none}
#panel.open{display:block}
#panel h2{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#9a9ab0;margin:14px 0 6px}
#panel h2:first-child{margin-top:0}
#panel .vrow{display:flex;gap:6px}
#panel .vrow button{flex:1;padding:8px 4px;border-radius:10px;background:#262634;font:600 12px/1.2 system-ui;color:#e9e9f2}
#panel .vrow button.on{background:#fff;color:#111}
#panel .scenes{display:flex;flex-direction:column;gap:2px}
#panel .scenes button{text-align:left;padding:5px 8px;border-radius:8px;color:#cfcfe0;font:13px/1.3 system-ui}
#panel .scenes button:hover{background:#262634}
#panel .scenes button.on{background:#2EA8FF;color:#fff}
#panel .ev{display:flex;flex-wrap:wrap;gap:6px}
#panel .ev button{padding:6px 9px;border-radius:8px;background:#262634;color:#e9e9f2;font:12px/1.2 system-ui}
#panel .ev button:hover{background:#34344a}
#panel p{margin:6px 0 0;color:#b9b9cc}
#panel .state{font:11px/1.45 var(--mono);color:#9fe3b9;white-space:pre-wrap;background:#0d0d13;border-radius:10px;padding:8px;margin-top:6px}

/* ---------- shared Bubble Pop parts ---------- */
.bg{position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,#fff 0,var(--cream) 40%,var(--cream2) 100%);overflow:hidden}
.bg i{position:absolute;border-radius:50%;opacity:.5;animation:floaty 9s ease-in-out infinite}
.bg i:nth-child(1){width:560px;height:560px;background:#CDEBFF;left:-140px;top:-180px}
.bg i:nth-child(2){width:440px;height:440px;background:#FFD6DC;right:-90px;top:240px;animation-delay:-3s}
.bg i:nth-child(3){width:380px;height:380px;background:#D9F7E6;left:42%;bottom:-200px;animation-delay:-6s}
@keyframes floaty{50%{transform:translate(30px,-26px) scale(1.06)}}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:48px}
.logo svg{width:56px;height:56px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(14deg) scale(1.1)}}
.av{--s:64px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--pc);display:inline-flex;align-items:center;justify-content:center;border:calc(var(--s)*.07) solid #fff;box-shadow:0 4px 0 var(--ledge);color:#fff;font-weight:700;font-size:calc(var(--s)*.5);-webkit-text-stroke:calc(var(--s)*.035) var(--ink);paint-order:stroke fill;line-height:1}
.cover{flex:none;border-radius:22px;border:5px solid #fff;box-shadow:0 6px 0 var(--ledge);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--c1),var(--c2));text-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:76px;padding:0 40px;border-radius:999px;font-weight:600;font-size:30px;background:#fff;box-shadow:0 8px 0 var(--ledge);transition:transform .2s var(--spring)}
.btn.go{background:var(--green);color:#fff;box-shadow:0 8px 0 #24A862}
.btn.red{background:var(--red);color:#fff;box-shadow:0 8px 0 #C7303F}
.btn.ink{background:var(--ink);color:#fff;box-shadow:0 8px 0 #14151f}
.btn.big{min-height:104px;font-size:48px;padding:0 80px;font-weight:700}
.btn.dis{opacity:.45;filter:grayscale(.6)}
.btn.breathe{animation:breathe 1.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;border-radius:999px;background:#fff;font-size:24px;font-weight:600;box-shadow:0 4px 0 var(--ledge);white-space:nowrap}
.chip.duet{background:var(--purple);color:#fff}
.chip.best{background:var(--yellow)}
.chip.warn{background:#FFE1E4;color:#B3192B}
.chip.off{background:rgba(43,45,66,.08);box-shadow:none;color:var(--ink2)}
.tag{font-size:18px;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--cream2);color:var(--ink2);white-space:nowrap}
.tag.warn{background:#FFE1E4;color:#B3192B}
.tag.sing{background:var(--green);color:#fff}
.card{background:#fff;border-radius:44px;box-shadow:0 10px 0 var(--ledge);padding:28px}
.row{display:flex;align-items:center;gap:18px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--ink2)}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pop{animation:pop .45s var(--spring) both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.sec{font-size:20px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.keys{font-size:20px;color:var(--mute);font-weight:500;display:flex;gap:22px;align-items:center}
.keys kbd{font:600 17px/1 var(--font);background:#fff;border-radius:8px;padding:4px 9px;box-shadow:0 3px 0 var(--ledge);color:var(--ink2);margin-right:4px}
.qr{background:#fff;border-radius:28px;padding:18px;box-shadow:0 8px 0 var(--ledge);display:inline-block}
.qr svg{display:block}
.code{display:flex;gap:12px;justify-content:center}
.code b{width:var(--cw,78px);height:calc(var(--cw,78px)*1.22);border-radius:22px;background:#fff;box-shadow:0 6px 0 var(--ledge);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw,78px)*.66);font-weight:700}
.nohttps{background:#fff;border-radius:28px;padding:24px;box-shadow:0 8px 0 var(--ledge);border:5px dashed #FF4B5C;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#B3192B;font-weight:600;line-height:1.2}
.nohttps svg{width:64px;height:64px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nohttps small{color:var(--ink2);font-weight:500;font-size:.75em}

/* focus: one ring for keyboard and mouse */
[data-f]{outline:none;position:relative}
[data-f]:focus{box-shadow:0 0 0 6px var(--yellow),0 0 0 10px var(--ink),0 8px 0 var(--ledge)!important;z-index:2;transform:scale(1.03);transition:transform .25s var(--spring)}
.hold{overflow:hidden}
.hold::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.4);transform:scaleX(0);transform-origin:left;pointer-events:none}
.hold.holding::after{transform:scaleX(1);transition:transform .7s linear}
.hold.dark::after{background:rgba(43,45,66,.25)}

/* modal + options (shared) */
.veil{position:absolute;inset:0;background:rgba(43,45,66,.4);z-index:30;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{position:absolute;z-index:31;background:var(--cream);border-radius:44px;box-shadow:0 12px 0 var(--ledge),0 30px 80px rgba(0,0,0,.3);padding:34px;animation:pop .4s var(--spring)}
.modal h3{margin:0 0 16px;font-size:36px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g2 .opt{font-size:24px;min-height:70px}
.opt{display:flex;align-items:center;gap:16px;width:100%;padding:14px 20px;border-radius:28px;background:#fff;box-shadow:0 5px 0 var(--ledge);font-size:26px;font-weight:600;text-align:left;margin-bottom:12px;min-height:76px}
.opt.on{box-shadow:0 0 0 4px var(--ink),0 5px 0 var(--ledge)}
.opt.off{opacity:.42}
.opt small{font-size:19px;color:var(--mute);font-weight:500;margin-left:auto}
.seg{display:flex;background:rgba(43,45,66,.08);border-radius:999px;padding:6px;gap:6px}
.seg button{flex:1;min-height:64px;border-radius:999px;font-weight:600;font-size:26px}
.seg button.on{background:#fff;box-shadow:0 4px 0 var(--ledge)}

/* toasts (layer above every screen) */
#toasts{position:absolute;inset:0;pointer-events:none;z-index:60}
.toast{display:flex;align-items:center;gap:14px;font-weight:500;font-size:28px;animation:pop .45s var(--spring);white-space:nowrap}
.toast .av{--s:46px;box-shadow:none}
.toast em{font-style:normal;font-weight:700}
.toast.out{animation:tout .35s ease-in forwards}
@keyframes tout{to{opacity:0;transform:translateY(-14px) scale(.9)}}
/* A: ink pills top centre, like the Phone */
#toasts.A{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:150px}
#toasts.A .toast{background:var(--ink);color:#fff;border-radius:999px;padding:10px 30px 10px 12px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#toasts.A.sing{padding-top:90px}
/* B: speech bubbles rising from bottom left */
#toasts.B{display:flex;flex-direction:column-reverse;align-items:flex-start;gap:16px;padding:0 0 60px 60px;justify-content:flex-start}
#toasts.B .toast{flex-direction:row;gap:0}
#toasts.B .toast .av{--s:84px;font-size:42px}
#toasts.B .toast span{background:#fff;border-radius:40px;padding:18px 32px;margin-left:18px;box-shadow:0 8px 0 var(--ledge);position:relative;font-size:32px}
#toasts.B .toast span::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-12px;border:12px solid transparent;border-right:16px solid #fff;border-left:0}
#toasts.B.sing{justify-content:flex-end;flex-direction:column;padding:56px 0 0 50px}
#toasts.B.sing .toast .av{--s:60px;font-size:30px}
#toasts.B.sing .toast span{font-size:26px;padding:12px 24px}
/* C: toasts go to the rail feed; over the sing screen a small stack top right */
#toasts.C{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding:190px 30px 0 0}
#toasts.C .toast{background:rgba(255,255,255,.9);border-radius:22px;padding:8px 20px 8px 8px;font-size:22px;box-shadow:0 5px 0 rgba(43,45,66,.2);border-left:10px solid var(--pc)}
#toasts.C .toast .av{--s:38px}
#toasts.C.rail{display:none}

/* ---------- small corner QR (sing screen, all takes) ---------- */
.cornerqr{position:absolute;right:30px;top:30px;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;padding:10px 18px 10px 10px;font-weight:700;font-size:30px;box-shadow:0 6px 0 rgba(43,45,66,.18)}
.cornerqr .qr{padding:8px;border-radius:16px;box-shadow:none}
.cornerqr small{display:block;font-size:16px;font-weight:500;color:var(--ink2)}

/* ---------- sing screen (shared base; mic lost marker differs per take) ---------- */
.singscr{position:absolute;inset:0;background:#2B2D42}
.singscr canvas{position:absolute;inset:0}
.vtag{position:absolute;left:30px;top:30px;font-size:20px;font-weight:600;color:#fff;background:rgba(0,0,0,.35);padding:4px 14px;border-radius:999px}
.sprog{position:absolute;left:80px;right:440px;top:52px;height:12px;border-radius:9px;background:rgba(255,255,255,.5);box-shadow:0 3px 0 rgba(43,45,66,.15)}
.sprog i{display:block;height:100%;border-radius:9px;background:var(--yellow)}
.badge{position:absolute;left:58px;display:flex;align-items:center;gap:14px;z-index:3}
.badge .nm{font-size:26px;font-weight:600;line-height:1.05;color:var(--ink)}
.badge .nm i{font-style:normal;font-size:.72em;color:var(--ink2);display:block}
.badge .sc{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.lyrics{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);text-align:center;white-space:nowrap;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:48px;padding:10px 60px 14px;box-shadow:0 10px 0 rgba(43,45,66,.2);font-weight:700;line-height:1.1}
.lyrics .l1{font-size:58px}
.lyrics .l2{font-size:34px;color:var(--ink2);font-weight:600}
.lyrics .f{background:linear-gradient(90deg,var(--fill) var(--p),var(--ink) 0);-webkit-background-clip:text;background-clip:text;color:transparent}
.paused{position:absolute;inset:0;background:rgba(43,45,66,.55);z-index:20;display:flex;align-items:center;justify-content:center;animation:fade .2s}
.paused .card{display:flex;flex-direction:column;gap:18px;align-items:stretch;width:620px;text-align:center}
.paused h2{margin:0 0 6px;font-size:56px}
.lost-A{position:absolute;display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:999px;padding:10px 28px 10px 14px;font-size:28px;font-weight:600;z-index:4;transform:translate(-50%,-50%);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.lost-A svg{width:40px;height:40px}
.lost-A .dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-left:5px;animation:dot 1.2s infinite}
.lost-A .dots i:nth-child(2){animation-delay:.2s}.lost-A .dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{opacity:.2}}
.lost-B{position:absolute;width:62px;height:62px;border-radius:50%;background:var(--red);color:#fff;border:5px solid #fff;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 5px 0 rgba(0,0,0,.2);animation:wobble 1.4s var(--spring) infinite}
.lost-B svg{width:34px;height:34px}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) scale(1.12)}40%{transform:rotate(10deg)}}
.lost-Bt{position:absolute;font-size:24px;font-weight:700;color:#B3192B;background:#fff;border-radius:999px;padding:2px 14px;z-index:5}
.lost-C{position:absolute;display:flex;align-items:center;gap:16px;font-size:26px;font-weight:600;color:#fff;z-index:4}
.lost-C b{font-weight:700}
.lost-C svg{width:36px;height:36px}

/* ---------- moved here (shared) ---------- */
.moved{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.moved h1{font-size:96px;margin:0;line-height:1}
.moved p{font-size:36px;margin:0;color:var(--ink2);max-width:1100px}
.moved .tv{width:300px;height:220px}

/* ============ A · Tabs on the TV ============ */
.A .top{position:absolute;left:60px;right:60px;top:36px;display:flex;align-items:center;gap:22px;z-index:5}
.A .tabs{display:flex;gap:14px;margin-left:30px}
.A .tabs button{font-weight:600;font-size:30px;padding:12px 30px;border-radius:999px;background:#fff;box-shadow:0 6px 0 var(--ledge);display:flex;align-items:center;gap:12px}
.A .tabs button.on{background:var(--red);color:#fff;box-shadow:0 6px 0 #C7303F}
.A .tabs .n{font-size:20px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 11px}
.A .tabs button.on .n{background:#fff;color:var(--red)}
.A .minijoin{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:22px;font-weight:600;line-height:1.1}
.A .minijoin .qr{padding:8px;border-radius:16px}
.A .minijoin b{font-size:40px;letter-spacing:.06em;display:block}
.A .strip{position:absolute;left:60px;right:60px;bottom:30px;display:flex;align-items:center;gap:20px;background:#fff;border-radius:999px;padding:12px 16px 12px 12px;box-shadow:0 8px 0 var(--ledge);font-size:26px;font-weight:600;z-index:5}
.A .strip .cover{width:64px;height:64px;border-radius:18px;border-width:3px;font-size:22px}
.A .strip .keys{margin-left:auto}
.A .page{position:absolute;left:60px;right:60px;top:170px;bottom:140px}
.A h1{font-size:64px;margin:0;line-height:1.05}
.A .idle{display:grid;grid-template-columns:1fr 600px;gap:50px;height:100%;align-items:center}
.A .idle .msg h1{font-size:96px}
.A .idle .msg p{font-size:36px;color:var(--ink2);margin:20px 0 40px}
.A .idle .joinbig{text-align:center}
.A .idle .joinbig .url{font-size:30px;font-weight:600;margin-top:22px}
.A .seat{display:flex;align-items:center;gap:22px;background:#fff;border-radius:40px;padding:16px 26px 16px 16px;box-shadow:0 8px 0 var(--ledge);width:100%;text-align:left;margin-bottom:18px;min-height:120px}
.A .seat .av{--s:88px}
.A .seat .nm{font-size:38px;font-weight:700}
.A .seat .chips{display:flex;gap:12px;margin-left:auto}
.A .seat .edit{font-size:34px;color:var(--mute)}
.A .lu{display:grid;grid-template-columns:1fr 520px;gap:50px;height:100%}
.A .lu .side{display:flex;flex-direction:column;gap:20px}
.A .lu .warns{display:flex;flex-direction:column;gap:10px}
.A .lu .warn{font-size:26px;font-weight:600;color:#B3192B;background:#FFE1E4;border-radius:24px;padding:12px 22px;display:flex;gap:12px;align-items:center}
.A .add{width:100%;border:4px dashed rgba(43,45,66,.25);border-radius:40px;min-height:100px;font-size:30px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.4)}
.A .res{display:grid;grid-template-columns:1fr 460px;gap:46px;height:100%}
.A .rrow{display:flex;align-items:center;gap:22px;background:#fff;border-radius:40px;padding:16px 30px 16px 16px;box-shadow:0 8px 0 var(--ledge);margin-bottom:18px;border-left:18px solid var(--pc)}
.A .rrow .place{font-size:56px;font-weight:700;width:70px;text-align:center;color:var(--ink2)}
.A .rrow .av{--s:84px}
.A .rrow .nm{font-size:36px;font-weight:700}
.A .rrow .rank{font-size:26px;font-weight:600;color:var(--pc2,var(--ink2))}
.A .rrow .parts{display:flex;gap:22px;white-space:nowrap;font-size:22px;color:var(--ink2);font-weight:500;margin-left:auto;text-align:right}
.A .rrow .parts b{display:block;font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums}
.A .rrow .tot{font-size:72px;font-weight:700;font-variant-numeric:tabular-nums;min-width:220px;text-align:right}
.A .ppl{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.A .pcard{background:#fff;border-radius:40px;padding:20px;box-shadow:0 8px 0 var(--ledge);display:flex;align-items:center;gap:20px;border-bottom:10px solid var(--pc);position:relative}
.A .pcard .av{--s:96px}
.A .pcard .nm{font-size:36px;font-weight:700}
.A .pcard .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

      startSing(40); if(sc==='sing-lost'){S.lost={mia:34};S.lostEver={mia:true};} break;
    case 'results': case 'results-early': S.queue=freshQueue();
      S.seats=[{pid:'bo',mic:'ph:bo',voice:1,diff:'Medium'},{pid:'jonas',mic:'L1',voice:2,diff:'Hard'},{pid:'mia',mic:'ph:mia',voice:1,diff:'Easy'}];
      S.lostEver={mia:true};makeResults(sc==='results-early');break;
    case 'people': if(!S.queue.length)S.queue=freshQueue(); if(!S.seats.length)prefill();
      if(S.scene==='sing'||S.scene==='moved')S.scene='lineup';
      if(S.take==='A'){S.tab='people';}
      else if(S.take==='B'){S.scene=S.scene==='sing'||S.scene==='moved'?'lineup':S.scene;S.overlay='people';}
      else {S.scene=S.scene==='sing'||S.scene==='moved'?'lineup':S.scene;} break;
    case 'queue': if(!S.queue.length)S.queue=freshQueue(); if(!S.seats.length)prefill();
      if(S.take==='A'){S.tab='queue';if(S.scene==='sing'||S.scene==='moved')S.scene='lineup';}
      else if(S.take==='B'){if(S.scene==='sing'||S.scene==='moved')S.scene='lineup';S.overlay='queue';}
      else {if(S.scene==='sing'||S.scene==='moved')S.scene='lineup';} break;
    case 'songs': if(S.take==='A'){S.tab='songs';if(S.scene==='sing'||S.scene==='moved')S.scene='idle';} else {S.overlay='songs';if(S.scene==='sing'||S.scene==='moved')S.scene='idle';} break;
    case 'moved': S.scene='moved';break;
  }

}
function prefill(){
  const r=S.queue[0];S.seats=[];if(!r)return;const used=new Set();const duet=SONGS[r.song].duet;
  r.who.forEach((pid,i)=>{const p=P(pid);if(!p)return;let mic=null;
    if(p.phone&&!used.has('ph:'+pid))mic='ph:'+pid;else{const l=LOCALS.find(l=>!used.has(l.id));if(l)mic=l.id;}
    if(mic)used.add(mic);S.seats.push({pid,mic,voice:duet?(i%2)+1:1,diff:p.diff});});
}
function micLabel(m){if(!m)return 'no mic';if(m.startsWith('ph:'))return P(m.slice(3))?.name+"'s Phone";return LOCALS.find(l=>l.id===m).label;}
function micOptions(seat){const opts=[];S.people.filter(p=>p.phone).forEach(p=>opts.push({id:'ph:'+p.id,label:p.name+"'s Phone"}));LOCALS.forEach(l=>opts.push(l));

function warnings(){const w=[];const song=head();if(!song)return w;

function makeResults(early){
  S.unfinished=early;
  S.results=S.seats.map(s=>{const p=P(s.pid);let tot=SCORES[s.pid]||4000;if(early)tot=Math.round(tot*.41);
    const line=Math.min(1000,Math.round(tot*.1));const gold=Math.round(tot*.14);const notes=tot-line-gold;

let qrCache={};
function qr(size){
  if(!S.https&&size<200)return `<div class="nohttps" style="width:${size+20}px;height:${size+20}px;font-size:18px;padding:8px;gap:4px;border-width:4px">${I.lock.replace('class="ico"','style="width:34px;height:34px"')}needs HTTPS</div>`;
  if(!S.https)return `<div class="nohttps" style="width:${size+36}px;height:${size+36}px;font-size:${Math.max(20,size/11)}px">${I.lock.replace('class="ico"','')}Phones can't sing yet<small>This Stage was opened over plain http://. Set up HTTPS (see the Caddy example), then reload.</small></div>`;
  if(!qrCache[size]){const n=29,c=size/n;let seed=4821;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;let d='';
    const fin=(x,y)=>x<7&&y<7||x>=n-7&&y<7||x<7&&y>=n-7;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(fin(x,y))continue;if(rnd()<.48)d+=`M${x*c} ${y*c}h${c}v${c}h${-c}z`;}
    let f='';[[0,0],[n-7,0],[0,n-7]].forEach(([x,y])=>{f+=`<rect x="${x*c+c/2}" y="${y*c+c/2}" width="${6*c}" height="${6*c}" rx="${c*1.6}" fill="none" stroke="#2B2D42" stroke-width="${c}"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" rx="${c*.8}" fill="#2B2D42"/>`;});
    qrCache[size]=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><path d="${d}" fill="#2B2D42"/>${f}</svg>`;}
  return `<div class="qr">${qrCache[size]}</div>`;
}

  const frame=()=>{if(S.scene!=='sing'){return;}const t=songT();const beat=t*6;
    // fake video
    const gr=g.createLinearGradient(0,0,1920,1080);const h1=(t*8)%360;gr.addColorStop(0,`hsl(${h1},55%,40%)`);gr.addColorStop(1,`hsl(${(h1+80)%360},60%,22%)`);g.fillStyle=gr;g.fillRect(0,0,1920,1080);
    for(let i=0;i<5;i++){g.beginPath();g.fillStyle=`hsla(${(h1+i*60)%360},80%,65%,.25)`;g.arc(300+i*360+Math.sin(t*.4+i)*120,300+Math.cos(t*.3+i)*160,180+i*20,0,7);g.fill();}
    const L=lanes();const PX=44,PH=600;
    L.forEach((ln,i)=>{const p=P(ln.pid);const pc=col(p.colour);const lost=S.lost[ln.pid]!==undefined;
      // frosted lane
      g.save();rr(g,ln.x,ln.y,ln.w,ln.h,ln.h/2.6);g.fillStyle='rgba(255,255,255,.66)';g.fill();g.clip();
      g.fillStyle=pc+'29';g.fillRect(ln.x,ln.y,ln.w,ln.h);
      if(lost&&S.take==='A'){g.fillStyle='rgba(124,130,160,.55)';g.fillRect(ln.x,ln.y,ln.w,ln.h);}
      if(lost&&S.take==='B'){g.fillStyle='rgba(255,75,92,.18)';for(let x=-200+((beat*PX)%40);x<1920;x+=40){g.beginPath();g.moveTo(x,ln.y+ln.h);g.lineTo(x+ln.h,ln.y);g.lineTo(x+ln.h+16,ln.y);g.lineTo(x+16,ln.y+ln.h);g.fill();}}
      g.beginPath();g.rect(ln.x+290,ln.y,ln.w,ln.h);g.clip();
      const nh=Math.max(18,ln.h*.17),top=ln.y+ln.h*.12,rowh=(ln.h*.76-nh)/5;
      const notes=NOTES[ln.voice];const dim=lost&&S.take==='C';
      for(const n of notes){const x=PH+(n.b-beat)*PX;if(x>1920)break;if(x+n.len*PX<ln.x+260)continue;
        const y=top+(5-n.p)*rowh;const past=n.b+n.len<beat;
        rr(g,x,y,n.len*PX-4,nh,nh/2);
        if(n.g&&!past){const gg=g.createLinearGradient(0,y,0,y+nh);gg.addColorStop(0,'#FFE58A');gg.addColorStop(1,'#FFB020');g.fillStyle=gg;}else g.fillStyle=past?'#ECEDF5':'#fff';
        g.globalAlpha=dim?.4:1;g.fill();g.lineWidth=4;g.strokeStyle='#2B2D42';g.stroke();g.globalAlpha=1;}
      // pitch line (sung), stops where mic lost
      const lostB=lost?S.lost[ln.pid]*6:Infinity;g.beginPath();let started=false;
      for(let b=Math.max(0,beat-7);b<=Math.min(beat,lostB);b+=.1){const n=notes.find(n=>b>=n.b&&b<n.b+n.len);if(!n){started=false;continue;}
        const x=PH+(b-beat)*PX;const y=top+(5-n.p)*rowh+nh/2+Math.sin(b*3+i)*nh*.35;if(!started){g.moveTo(x,y);started=true;}else g.lineTo(x,y);}
      g.lineWidth=12;g.strokeStyle='#2B2D42';g.lineCap='round';g.lineJoin='round';g.stroke();g.lineWidth=8;g.strokeStyle=pc;g.stroke();
      // playhead
      g.fillStyle='rgba(43,45,66,.35)';g.fillRect(PH-2,ln.y+6,4,ln.h-12);
      g.restore();
      if(lost&&S.take==='C'){g.save();rr(g,ln.x,ln.y,ln.w,ln.h,ln.h/2.6);g.fillStyle='rgba(43,45,66,.72)';g.fill();g.restore();}
      const sc=document.getElementById('sc'+i);if(sc&&!(lost&&S.take!=='A')){const tot=Math.round(Math.min(SCORES[ln.pid]||4000,(lost?S.lost[ln.pid]:t)*(SCORES[ln.pid]||4000)/240));sc.textContent=Math.max(0,tot);}
    });
    const pr=document.getElementById('sprog');if(pr)pr.style.width=Math.min(100,12+t/2)+'%';
    raf=requestAnimationFrame(frame);};
  frame();}
function rr(g,x,y,w,h,r){r=Math.min(r,h/2,w/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* =================== toasts =================== */
function toast(pid,msg){const p=P(pid)||{name:'Someone',colour:'cherry'};
  if(S.take==='C'){S.feed.unshift({who:pid,name:p.name,msg,fresh:true});S.feed.forEach((f,i)=>{if(i)f.ago=i<2?'1 min':i+' min';});
    if(S.scene!=='sing'&&S.scene!=='moved'){render();return;}}
  const el=document.createElement('div');el.className='toast';el.style.setProperty('--pc',col(p.colour));
  el.innerHTML=S.take==='B'?`${av(p)}<span><b>${esc(p.name)}</b> ${msg}</span>`:`${av(p)}<span><b>${esc(p.name)}</b> ${msg}</span>`;
  toastsEl.appendChild(el);while(toastsEl.children.length>3)toastsEl.firstChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),400);},4200);}
let toastI=0;

/* =================== actions =================== */
function act(a,arg){
  if(['openSeat','pop','overlay'].includes(a)&&arg)S.opener=document.activeElement?.dataset?.k;
  if(!['tab','overlay','closeOverlay','openSeat','pop','closePop'].includes(a))S.cur=null;
  const s=S.pop!=null?S.seats[S.take==='A'?S.pop.seat:+String(S.pop).split(':')[0]]:null;
  switch(a){
    case 'tab':S.tab=arg;S.pop=null;S.songAdded=null;break;
    case 'overlay':S.overlay=arg;S.songAdded=null;break;
    case 'closeOverlay':S.overlay=null;break;
    case 'openSeat':S.pop={seat:+arg};break;
    case 'pop':S.pop=arg;break;
    case 'closePop':S.pop=null;break;
    case 'setWho':if(s&&!S.seats.some(x=>x!==s&&x.pid===arg)){s.pid=arg;s.diff=P(arg).diff;}if(S.take!=='A')S.pop=null;break;
    case 'setMic':if(s&&!S.seats.some(x=>x!==s&&x.mic===arg))s.mic=arg;if(S.take!=='A')S.pop=null;break;
    case 'setVoice':if(s)s.voice=+arg;if(S.take!=='A')S.pop=null;break;
    case 'setDiff':if(s)s.diff=arg;if(S.take!=='A')S.pop=null;break;
    case 'cycleVoice':S.seats[+arg].voice=S.seats[+arg].voice===1?2:1;break;
    case 'cycleDiff':{const d=['Easy','Medium','Hard'];const x=S.seats[+arg];x.diff=d[(d.indexOf(x.diff)+1)%3];break;}
    case 'removeSeat':S.seats.splice(+arg,1);S.pop=null;break;
    case 'addSeat':{const seated=new Set(S.seats.map(x=>x.pid));const p=S.people.find(q=>!seated.has(q.id));if(!p)break;const used=new Set(S.seats.map(x=>x.mic));
      let mic=p.phone&&!used.has('ph:'+p.id)?'ph:'+p.id:(LOCALS.find(l=>!used.has(l.id))||{}).id||null;
      const duet=head()?.duet;const v=duet?(S.seats.filter(x=>x.voice===1).length>S.seats.filter(x=>x.voice===2).length?2:1):1;
      S.seats.push({pid:p.id,mic,voice:v,diff:p.diff});
      if(S.take==='A')S.pop={seat:S.seats.length-1};break;}
    case 'start':if(warnings().length){flash('start');return;}startSing();S.cur='sing';break;
    case 'resume':S.paused=false;S.t0=performance.now()-S.pauseAt*1000;break;
    case 'restart':startSing();break;
    case 'skip':S.paused=false;S.queue.shift();prefill();S.scene=S.queue.length?'lineup':'idle';break;
    case 'end':S.paused=false;makeResults(true);break;
    case 'nextSong':S.queue.shift();prefill();S.scene=S.queue.length?'lineup':'idle';S.tab='stage';break;
    case 'removePerson':{const p=P(arg);S.people=S.people.filter(q=>q.id!==arg);S.seats=S.seats.filter(x=>x.pid!==arg);S.queue.forEach(r=>r.who=r.who.filter(w=>w!==arg));
      S.feed.unshift({who:null,name:p.name,msg:`left the Party. ${cap(p.colour)} is free`,fresh:true});render();
      showToastRaw(p,`left the Party. ${cap(p.colour)} is free`);return;}
    case 'newParty':S.people=[];S.queue=[];S.seats=[];S.feed=[];S.scene='idle';S.tab='stage';S.overlay=null;break;
    case 'qUp':{const i=+arg;if(i>1){[S.queue[i-1],S.queue[i]]=[S.queue[i],S.queue[i-1]];}else if(i===1){[S.queue[0],S.queue[1]]=[S.queue[1],S.queue[0]];if(S.scene==='lineup')prefill();}break;}
    case 'qDown':{const i=+arg;[S.queue[i+1],S.queue[i]]=[S.queue[i],S.queue[i+1]];break;}
    case 'playNext':{const i=+arg;const [r]=S.queue.splice(i,1);S.queue.splice(1,0,r);break;}
    case 'qRemove':S.queue.splice(+arg,1);break;
    case 'railQ':break;
    case 'addSong':S.queue.push({song:arg,who:[],by:null});S.songAdded=arg;if(S.scene==='idle'){prefill();S.scene='lineup';}break;
    case 'takeback':S.scene=S.queue.length?'lineup':'idle';S.cur=S.scene;break;
  }
  render();
}
function showToastRaw(p,msg){const el=document.createElement('div');el.className='toast';el.style.setProperty('--pc',col(p.colour));
  el.innerHTML=`${av(p)}<span><b>${esc(p.name)}</b> ${msg}</span>`;if(S.take==='C'&&S.scene!=='sing')return;toastsEl.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),400);},4200);}
function flash(k){const e=scr.querySelector(`[data-k="${k}"]`);if(!e)return;e.animate([{transform:'translateX(0)'},{transform:'translateX(-12px)'},{transform:'translateX(12px)'},{transform:'translateX(0)'}],{duration:300});}

/* =================== remote events =================== */
const EVENTS=[
  ['Remote toast',()=>{const [p,m]=TOASTS[toastI++%TOASTS.length];toast(p,m);}],
  ['Remote moves Africa up',()=>{const i=S.queue.findIndex(r=>r.song==='africa');if(i>1){[S.queue[i-1],S.queue[i]]=[S.queue[i],S.queue[i-1]];}toast('bo','moved <em>Africa</em> up');if(S.take!=='C')render();}],
  ['Remote sets Jonas to Voice 2',()=>{const s=S.seats.find(s=>s.pid==='jonas');if(s){s.voice=2;}toast('sara','put Jonas on Voice 2');if(S.take!=='C')render();}],
  ['Phone joins (Noor)',()=>{if(P('noor'))return;const taken=new Set(S.people.map(p=>p.colour));const c=PAL.find(p=>!taken.has(p[0]));if(!c)return;S.people.push({id:'noor',name:'Noor',kind:'guest',colour:c[0],phone:true,diff:'Medium'});toast('noor','joined the Party');if(S.take!=='C')render();}],
  ['Remote pauses',()=>{if(S.scene!=='sing'||S.paused)return;S.paused=true;S.pauseAt=songT();toast('sara','paused the Song');render();}],
  ['Mia\'s mic lost / back',()=>{if(S.scene!=='sing')return;if(S.lost.mia!==undefined){delete S.lost.mia;toast('mia','is back on the mic');}else{S.lost.mia=songT();S.lostEver.mia=true;}render();}],
  ['Another browser takes the Stage',()=>{S.scene='moved';S.cur='moved';S.pop=null;S.overlay=null;render();}],
];

/* =================== panel =================== */
const panel=document.getElementById('panel');
function renderPanel(){
  panel.innerHTML=`<h2>Take</h2><div class="vrow">${Object.keys(TAKES).map(k=>`<button data-take="${k}" class="${S.take===k?'on':''}">${k} ${TAKES[k]}</button>`).join('')}</div>
   <h2>Scene</h2><div class="scenes">${SCENES.map(([k,l])=>`<button data-scene="${k}" class="${S.cur===k?'on':''}">${l}</button>`).join('')}</div>
   <h2>Remote does...</h2><div class="ev">${EVENTS.map(([l],i)=>`<button data-ev="${i}">${l}</button>`).join('')}</div>
   <p>Stage keys: arrows move focus, Enter picks, Esc backs out, hold Enter on hold buttons. Mouse: hover focuses, click picks, press and hold. ${S.take==='A'?'1–4 switch tabs.':S.take==='B'?'S songs, Q Queue, P people, Space Start or pause.':'Space Start or pause.'}</p>
   <h2>State</h2><div class="state">scene: ${S.scene}${S.take==='A'?' · tab: '+S.tab:''}${S.overlay?' · overlay: '+S.overlay:''}
queue: ${S.queue.map(r=>SONGS[r.song].t).join(' → ')||'(empty)'}
line-up: ${S.seats.map(s=>`${P(s.pid)?.name} [${micLabel(s.mic)}, V${s.voice}, ${s.diff}]`).join('\n  ')||'-'}
warnings: ${warnings().map(w=>w.text).join('; ')||'none'}
people: ${S.people.map(p=>p.name+'/'+p.colour).join(', ')}
mic lost: ${Object.keys(S.lost).join(',')||'-'}</div>`;
  document.getElementById('lbl').textContent=`${S.take} · ${TAKES[S.take]}`;
}
panel.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.take){setTake(t.dataset.take);}
  else if(t.dataset.scene)setScene(t.dataset.scene);
  else if(t.dataset.ev)EVENTS[+t.dataset.ev][1]();});
function setTake(t){const from=S.take;if(from===t)return;S.take=t;S.pop=null;toastsEl.innerHTML='';
  const side=from==='A'?(S.tab!=='stage'?S.tab:null):S.overlay;
  if(t==='A'){S.tab=side||'stage';S.overlay=null;}else if(t==='B'){S.overlay=side;}else{S.overlay=side==='songs'?'songs':null;}
  render(true);}
function switchTake(d){const ks=Object.keys(TAKES);setTake(ks[(ks.indexOf(S.take)+d+3)%3]);}
document.getElementById('prev').onclick=()=>switchTake(-1);
document.getElementById('next').onclick=()=>switchTake(1);
document.getElementById('pbtn').onclick=()=>panel.classList.toggle('open');

/* =================== input: keyboard + mouse =================== */
function focusables(){const root=scr.querySelector('.modal,.drop,.paused')||scr;return [...root.querySelectorAll('[data-f]')].filter(e=>e.offsetParent!==null||e.getClientRects().length);}
function move(dir){const els=focusables();const cur=document.activeElement;if(!els.includes(cur)){els[0]?.focus();return;}
  const r=cur.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=Infinity;
  for(const e of els){if(e===cur)continue;const q=e.getBoundingClientRect();const x=q.left+q.width/2,y=q.top+q.height/2;const dx=x-cx,dy=y-cy;let m,c;
    if(dir==='left'){if(dx>-4)continue;m=-dx;c=Math.abs(dy);}if(dir==='right'){if(dx<4)continue;m=dx;c=Math.abs(dy);}
    if(dir==='up'){if(dy>-4)continue;m=-dy;c=Math.abs(dx);}if(dir==='down'){if(dy<4)continue;m=dy;c=Math.abs(dx);}
    const sc=m+c*2.2;if(sc<bs){bs=sc;best=e;}}
  if(best){best.focus({preventScroll:true});lastFocusKey=best.dataset.k;}}
let holdEl=null,holdT=null;
function holdStart(el){if(holdEl)return;holdEl=el;el.classList.add('holding');holdT=setTimeout(()=>{el.classList.remove('holding');holdEl=null;act(el.dataset.act,el.dataset.arg);},700);}
function holdEnd(){if(!holdEl)return;clearTimeout(holdT);holdEl.classList.remove('holding');holdEl=null;}
scr.addEventListener('pointerover',e=>{const t=e.target.closest('[data-f]');if(t&&t!==document.activeElement&&(!scr.querySelector('.modal,.drop')||t.closest('.modal,.drop'))){t.focus({preventScroll:true});lastFocusKey=t.dataset.k;}});
scr.addEventListener('pointerdown',e=>{const t=e.target.closest('.hold');if(t){e.preventDefault();holdStart(t);}});
addEventListener('pointerup',holdEnd);
scr.addEventListener('pointerout',e=>{if(holdEl&&e.target.closest('.hold')===holdEl&&!holdEl.contains(e.relatedTarget))holdEnd();});
scr.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.classList.contains('hold'))return;if(t.classList.contains('dis')){flash(t.dataset.k);return;}act(t.dataset.act,t.dataset.arg);});
addEventListener('keydown',e=>{
  if(e.key==='['){switchTake(-1);return;}if(e.key===']'){switchTake(1);return;}if(e.key==='`'){panel.classList.toggle('open');return;}
  const k=e.key;
  if(S.scene==='sing'&&!S.paused){if(k===' '||k==='Escape'||k==='Enter'){e.preventDefault();S.paused=true;S.pauseAt=songT();render();}return;}
  if(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();move(k.slice(5).toLowerCase());return;}
  if(k==='Enter'){e.preventDefault();const t=document.activeElement;if(!t||!t.dataset||t.dataset.f===undefined)return;if(e.repeat)return;
    if(t.classList.contains('hold')){holdStart(t);return;}if(t.classList.contains('dis')){flash(t.dataset.k);return;}if(t.dataset.act)act(t.dataset.act,t.dataset.arg);return;}
  if(k==='Escape'){if(S.paused){act('resume');return;}if(S.pop){act('closePop');return;}if(S.overlay){act('closeOverlay');return;}if(S.take==='A'&&S.tab!=='stage'){act('tab','stage');return;}return;}
  if(k===' '&&S.scene==='lineup'&&!S.pop){e.preventDefault();act('start');return;}
  if(S.take==='A'&&/^[1-4]$/.test(k)&&!S.pop){act('tab',['songs','queue','stage','people'][+k-1]);return;}
  if(S.take==='B'&&!S.pop){const m={s:'songs',q:'queue',p:'people'}[k.toLowerCase()];if(m){act('overlay',S.overlay===m?null:m);}}
});
addEventListener('keyup',e=>{if(e.key==='Enter')holdEnd();});

/* =================== fit + boot =================== */
function fit(){const sc=Math.min(innerWidth/1920,(innerHeight-70)/1080);stage.style.transform=`translate(-50%,calc(-50% - 30px)) scale(${sc})`;}
addEventListener('resize',fit);fit();
(function boot(){const m=location.hash.match(/^#([abc])-([\w-]+)/);if(m){S.take=m[1].toUpperCase();setScene(SCENES.some(s=>s[0]===m[2])?m[2]:'idle');}else setScene('idle');})();
</script>
</body>
