<!doctype html>
<!--
  PROTOTYPE — throwaway. "Visual direction" wayfinder ticket, round 3.
  Round 1 picked A (Bubble Pop); round 2 tried three multi-Player sing screens over the music video and
  A1 (split lanes) came closest. Round 3: five more layouts, with A1 kept for comparison.
  1 Top & bottom · 2 Corner pods · 3 Lower third · 4 Highways · 5 Still lanes · A1 Split lanes (round 2)
  ?variant=1..5|A1&screen=sing|browser&players=1-4&duet=0|1&seek=<beats>
  Keys: ←/→ variant · Esc browser · i info · h hide bar. "video…" plays a real file behind the sing screen.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenStar Visual Direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#0d0d12;--bar:#111;--bar-fg:#fff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--page)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform-origin:center center}
#stage>div{position:absolute;inset:0}
canvas{position:absolute;left:0;top:0}
.cover{position:relative;border-radius:24px;background:linear-gradient(135deg,var(--c1),var(--c2));overflow:hidden;display:flex;align-items:center;justify-content:center}
.cover svg{width:62%;height:62%}
.lyr span{display:inline-block;background:linear-gradient(90deg,var(--fill) calc(var(--p,0)*100%),var(--ink) 0);-webkit-background-clip:text;background-clip:text;color:transparent;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.lyr .cur.in{animation:lyin .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes lyin{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}

/* ---- A · Bubble Pop browser (unchanged from round 1) ---- */
.vA{background:radial-gradient(circle at 20% 10%,#fff 0,#FFF6E9 40%,#FFE7CC 100%);font-family:'Fredoka',system-ui,sans-serif;color:#2B2D42}
.vA .blobs i{position:absolute;border-radius:50%;opacity:.55;animation:floaty 9s ease-in-out infinite}
.vA .blobs i:nth-child(1){width:560px;height:560px;background:#CDEBFF;left:-140px;top:-180px}
.vA .blobs i:nth-child(2){width:440px;height:440px;background:#FFD6DC;right:-90px;top:140px;animation-delay:-3s}
.vA .blobs i:nth-child(3){width:380px;height:380px;background:#D9F7E6;left:42%;bottom:-200px;animation-delay:-6s}
@keyframes floaty{50%{transform:translate(30px,-26px) scale(1.06)}}
.vA .topbar{position:absolute;left:60px;right:60px;top:40px;display:flex;align-items:center;gap:24px}
.vA .logo{font-weight:700;font-size:64px;display:flex;align-items:center;gap:10px}
.vA .logo svg{width:72px;height:72px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(14deg) scale(1.1)}}
.vA .tabs{display:flex;gap:12px;margin-left:24px}
.vA .tabs b{font-weight:600;font-size:30px;padding:12px 26px;border-radius:999px;background:#fff;box-shadow:0 6px 0 rgba(43,45,66,.12)}
.vA .tabs b.on{background:#FF4B5C;color:#fff;box-shadow:0 6px 0 #C7303F}
.vA .search{margin-left:auto;font-size:28px;padding:14px 32px;border-radius:999px;background:#fff;color:#8a8ca0;box-shadow:inset 0 3px 0 rgba(0,0,0,.06)}
.vA .carousel{position:absolute;left:0;right:0;top:190px;height:460px}
.vA .item{position:absolute;left:50%;top:50%;width:340px;height:340px;margin:-170px 0 0 -170px;transition:transform .6s cubic-bezier(.34,1.56,.64,1),opacity .35s;cursor:pointer}
.vA .item .cover{width:100%;height:100%;border-radius:52px;border:9px solid #fff;box-shadow:0 18px 0 rgba(43,45,66,.12),0 26px 40px rgba(43,45,66,.18)}
.vA .item.sel .cover{animation:squish .65s cubic-bezier(.34,1.56,.64,1)}
@keyframes squish{0%{transform:scale(.88,1.12)}45%{transform:scale(1.08,.92)}100%{transform:none}}
.vA .meta{position:absolute;left:0;right:0;top:690px;text-align:center}
.vA .meta h1{font-size:92px;font-weight:700;margin:0;line-height:1}
.vA .meta p{font-size:40px;margin:10px 0 18px;color:#6b6d85;font-weight:500}
.vA .chips{display:flex;gap:14px;justify-content:center}
.vA .chips b{font-weight:600;font-size:28px;padding:8px 22px;border-radius:999px;background:#fff;box-shadow:0 5px 0 rgba(43,45,66,.1)}
.vA .chips b.duet{background:#9B5CFF;color:#fff}
.vA .chips b.best{background:#FFC93C}
.vA .pop{animation:popin .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popin{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.vA .sing-btn{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);font-size:56px;font-weight:700;color:#fff;background:#3DDC84;padding:18px 84px;border-radius:999px;box-shadow:0 10px 0 #24A862;animation:breathe 1.4s ease-in-out infinite;cursor:pointer}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.07)}}
.vA .card{position:absolute;bottom:48px;background:#fff;border-radius:36px;padding:22px 30px;box-shadow:0 10px 0 rgba(43,45,66,.1)}
.vA .queue{left:60px;width:460px}
.vA .queue h3{margin:0 0 8px;font-size:30px}
.vA .queue .q{display:flex;align-items:center;gap:14px;font-size:24px;margin:8px 0;font-weight:500}
.vA .queue .q .cover{width:50px;height:50px;border-radius:16px;flex:none}
.vA .queue .q i{margin-left:auto;font-style:normal;width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.vA .join{right:60px;display:flex;align-items:center;gap:20px;font-size:30px;font-weight:600;line-height:1.15}
.vA .join svg{width:130px;height:130px;color:#2B2D42}
.vA .join small{font-size:22px;color:#8a8ca0;font-weight:500}

/* ---- sing screen over video ---- */
.vA.sing{background:#2B2D42}
.vid{position:absolute;inset:0;overflow:hidden}
.vid canvas,.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid video{display:none}
.vid.real video{display:block}.vid.real canvas{display:none}
.vtag{position:absolute;right:28px;bottom:20px;font-size:20px;font-weight:600;color:#fff;background:rgba(0,0,0,.35);padding:4px 14px;border-radius:999px}
.vid.real .vtag{display:none}
.panel{position:absolute;border-radius:40px;background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);box-shadow:0 12px 0 rgba(43,45,66,.18),0 20px 40px rgba(0,0,0,.18)}
.panel.ring{border:6px solid var(--pc)}
.vA .av{width:var(--avs,72px);height:var(--avs,72px);border-radius:50%;background:var(--pc);color:#fff;font-size:calc(var(--avs,72px)*.52);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;border:4px solid #fff;box-shadow:0 4px 0 rgba(43,45,66,.15)}
.vA .nm{font-size:24px;font-weight:600;line-height:1.1}
.vA .nm i{font-style:normal;font-size:18px;color:#6b6d85}
.vA .sc{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:120px}
.vA .rating{position:absolute;font-size:42px;font-weight:700;color:var(--pc);opacity:0;white-space:nowrap;text-shadow:0 4px 0 #fff,0 -4px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff,0 10px 0 rgba(43,45,66,.2);z-index:3;transform:translate(-50%,-50%)}
.vA .rating.show{animation:rate 1.3s cubic-bezier(.34,1.56,.64,1)}
@keyframes rate{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.vA .lanebadge{position:absolute;display:flex;align-items:center;gap:14px}
.vA .lanebadge .rating{left:calc(100% + 110px);top:50%}
.vA .podhead{position:absolute;display:flex;align-items:center;gap:12px;padding:0 6px}
.vA .podhead .sc{margin-left:auto;text-align:right;font-size:40px}
.vA .podhead .rating{left:50%;top:calc(100% + 40px)}
.vA .prog{position:absolute;left:80px;right:80px;height:10px;border-radius:9px;background:rgba(255,255,255,.5);box-shadow:0 3px 0 rgba(43,45,66,.15)}
.vA .prog i{display:block;height:100%;border-radius:9px;background:#FFC93C}
.vA.sing .lyrics{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);text-align:center;white-space:nowrap;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:52px;padding:10px 60px 16px;box-shadow:0 10px 0 rgba(43,45,66,.2),0 20px 40px rgba(0,0,0,.2)}
.vA.sing.lyr-center .lyrics{bottom:auto;top:50%;transform:translate(-50%,-50%)}
.vA.sing.lyr-top .lyrics{bottom:auto;top:40px}
.vA .lyr .cur{font-size:78px;font-weight:700;--ink:#2B2D42;--fill:#FF4B5C;line-height:1.12}
.vA .lyr span.g{--ink:#E09A00}
.vA .lyr span.now{transform:translateY(-6px)}
.vA .lyr .nxt{font-size:36px;color:#8a8ca0;font-weight:600}
.vA.duet .lyr .cur{font-size:60px}
.vA.duet .lyr .nxt{display:none}

/* ---- prototype switcher (not part of the design) ---- */
#bar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;padding:6px;background:var(--bar);color:var(--bar-fg);border-radius:22px;font:600 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 6px 24px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.18);z-index:10;user-select:none;max-width:calc(100vw - 32px)}
#bar button,#bar label{all:unset;cursor:pointer;padding:8px 11px;border-radius:999px}
#bar button:hover,#bar label:hover{background:#2a2a2a}
#bar button.on{background:#fff;color:#111}
#bar input{display:none}
#bar .lbl{padding:0 6px;min-width:190px;text-align:center}
#bar .sep{width:1px;height:20px;background:#3a3a3a;margin:0 2px}
#bar .dim{opacity:.5;padding:0 2px}
#info{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--bar);color:#eee;border-radius:16px;padding:14px 18px;font:13px/1.5 ui-sans-serif,system-ui,sans-serif;display:none;z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#info.open{display:block}
#info h4{margin:0 0 6px;font-size:15px}
#info p{margin:4px 0}
#info b{color:#fff}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <button id="prev" title="Previous variant (←)">‹</button><span class="lbl" id="vl"></span><button id="next" title="Next variant (→)">›</button>
  <span class="sep"></span><button data-scr="browser">Browser</button><button data-scr="sing">Sing</button>
  <span class="sep"></span><span class="dim">players</span><button data-pl="1">1</button><button data-pl="2">2</button><button data-pl="3">3</button><button data-pl="4">4</button><button id="duet">Duet</button>
  <span class="sep"></span><label title="Play a real video file behind the sing screen">video…<input id="vf" type="file" accept="video/*"></label><button id="ib" title="What this take does (i)">info</button>
</div>
<div id="info"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const stage=$('#stage');
const P=new URLSearchParams(location.search);
const KEYS=['1','2','3','4','5','A1'];
const pv=(P.get('variant')||'').toUpperCase();
const state={variant:KEYS.includes(pv)?pv:'1',screen:P.get('screen')==='browser'?'browser':'sing',players:Math.min(4,Math.max(1,+(P.get('players')||4))),duet:P.get('duet')==='1',sel:0};
let videoURL=null;
const NAMES=['Sofie','Alex','Jonas'];
const SONGS=[
 {t:'Neon Summer',a:'Moonlit Arcade',y:2019,g:'Pop',len:'3:42',c:['#FF4B5C','#FFC93C'],sh:'star'},
 {t:'Paper Planes at Dawn',a:'The Lanterns',y:2008,g:'Indie',len:'4:05',c:['#2EA8FF','#9BE7FF'],sh:'tri'},
 {t:'Holiday Rocket',a:'Pixel Parade',y:2015,g:'Pop',len:'3:18',c:['#9B5CFF','#FF7AD9'],sh:'bolt'},
 {t:'Cherry Soda Heart',a:'Mina Vale',y:2021,g:'Pop',len:'2:58',c:['#FF5A8A','#FFB3C7'],sh:'heart'},
 {t:'Thunder in My Shoes',a:'Big Kettle',y:1997,g:'Rock',len:'4:31',c:['#FF9F1C','#FF4B5C'],sh:'bolt'},
 {t:'Starlight Duet',a:'Ola & Ben',y:2012,g:'Ballad',len:'3:55',c:['#3D5AFE','#22E4FF'],sh:'star',d:1},
 {t:'Disco Lighthouse',a:'Salt & Sugar',y:1979,g:'Disco',len:'5:02',c:['#FFC93C','#FF9F1C'],sh:'circle'},
 {t:'Gold Ring Road',a:'The Velvet Owls',y:1984,g:'Rock',len:'3:47',c:['#00B8A9','#B6FF3B'],sh:'wave'},
 {t:'Slow Motion Rain',a:'Ivy Hart',y:2005,g:'Ballad',len:'4:20',c:['#5C7CFA','#A5D8FF'],sh:'wave'},
 {t:'Rollerblade Queen',a:'Kiki Sunset',y:1992,g:'Pop',len:'3:33',c:['#FF3EA5','#FFC93C'],sh:'circle'},
 {t:'Kitchen Floor Tango',a:'Los Tranquilos',y:2001,g:'Latin',len:'3:12',c:['#E8590C','#FFD23F'],sh:'heart',d:1},
 {t:'Fireworks Over the Fjord',a:'Nordlys',y:2017,g:'Pop',len:'3:49',c:['#7048E8','#3DDC84'],sh:'star'},
];
SONGS.forEach((s,i)=>{s.best=[[NAMES[i%3],9480-i*173],[NAMES[(i+1)%3],8120-i*141],[NAMES[(i+2)%3],6900-i*97]]});
const N=SONGS.length,INK='#2B2D42';
const COL=['#FF4B5C','#2EA8FF','#3DDC84','#FFB020'];
const FX=['#FF4B5C','#2EA8FF','#3DDC84','#FFC93C','#9B5CFF'];
const fmt=n=>Math.round(n).toLocaleString('en-US');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rr=(c,x,y,w,h,r)=>{c.beginPath();c.roundRect(x,y,Math.max(1,w),Math.max(1,h),Math.max(0,Math.min(r,h/2,w/2)))};
function glyph(sh){return{
 star:'<polygon points="50,6 62,37 95,38 69,58 78,91 50,72 22,91 31,58 5,38 38,37"/>',
 circle:'<circle cx="50" cy="50" r="34"/><circle cx="50" cy="50" r="12" fill="rgba(0,0,0,.15)"/>',
 wave:'<path d="M0 55 Q25 25 50 55 T100 55 V100 H0Z"/><circle cx="72" cy="26" r="12"/>',
 tri:'<polygon points="50,10 93,88 7,88"/>',
 heart:'<path d="M50 88 L13 51 A21 21 0 0 1 50 22 A21 21 0 0 1 87 51 Z"/>',
 bolt:'<polygon points="58,4 18,58 46,58 36,96 82,38 54,38"/>'}[sh]}
const cover=s=>`<div class="cover" style="--c1:${s.c[0]};--c2:${s.c[1]}"><svg viewBox="0 0 100 100"><g fill="rgba(255,255,255,.88)">${glyph(s.sh)}</g></svg></div>`;
const STAR='<svg viewBox="0 0 100 100"><polygon fill="#FFC93C" stroke="#2B2D42" stroke-width="7" stroke-linejoin="round" points="50,6 62,37 95,38 69,58 78,91 50,72 22,91 31,58 5,38 38,37"/></svg>';
function qrSvg(){let seed=11;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;let s='';
 const inF=(x,y)=>(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);
 for(let y=0;y<21;y++)for(let x=0;x<21;x++)if(!inF(x,y)&&rnd()<.5)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
 const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
 return `<svg viewBox="-1.5 -1.5 24 24"><rect x="-1.5" y="-1.5" width="24" height="24" rx="2" fill="#fff"/><g fill="currentColor">${s}${f(0,0)}${f(14,0)}${f(0,14)}</g></svg>`}
function starPath(c,x,y,r,rot=0){c.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,R=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*R,y+Math.sin(a)*R)}c.closePath()}

/* ---------- demo song (original lyrics) and simulated singers ---------- */
const BEAT=0.16,LEAD=6;
const V1T=[["Turn ","the ","lights ","up, ","sing ","it ","loud ","to","night"],["E","very ","voice ","is ","shi","ning ","like ","a ","kite"],["Hold ","the ","note ","and ","let ","it ","fly"],["We're ","the ","stars ","a","cross ","the ","sky"]];
const V2T=[["Call ","the ","e","cho, ","sing ","it ","back ","to ","me"],["Ev","ery ","heart","beat ","drum","ming ","in ","the ","sea"],["Reach ","the ","high ","and ","let ","it ","go"],["We ","will ","shine ","be","fore ","the ","dawn"]];
const PITCH=[[62,62,64,65,67,65,64,62,60],[64,65,67,67,69,67,65,64,62],[67,67,72,71,69,67,69],[65,65,67,69,67,65,64]];
const DUR=[[2,1,2,3,2,1,2,2,5],[2,1,3,1,2,2,2,1,5],[2,1,6,1,2,1,6],[2,1,3,2,2,1,7]];
const GOLD=[[6],[8],[2,6],[6]];
function buildVoice(text,tr){const lines=[];let b=LEAD,w=0,mn=99,mx=0;
 text.forEach((syl,li)=>{const notes=[],start=b;syl.forEach((tx,si)=>{const n={start:b,len:DUR[li][si],pitch:PITCH[li][si]+tr,text:tx,gold:GOLD[li].includes(si)};notes.push(n);w+=n.len*(n.gold?2:1);mn=Math.min(mn,n.pitch);mx=Math.max(mx,n.pitch);b+=n.len});lines.push({start,end:b,notes});b+=4});
 return {lines,total:b+4,K:10000/w,min:mn-2,max:mx+2}}
const VOICES=[buildVoice(V1T,0),buildVoice(V2T,-5)];
const SONG_BEATS=VOICES[0].total;
const PLAYERS=[{name:'Alex',skill:.93},{name:'Sofie',skill:.82},{name:'Jonas',skill:.66},{name:'Ida',guest:true,skill:.86}];
function makeSession(n,duet){return PLAYERS.slice(0,n).map((p,i)=>resetP({...p,i,voice:duet?i%2:0}))}
function resetP(p){return Object.assign(p,{trail:[],score:0,shown:0,cur:null,lastPitch:null,missT:0,missOff:0,lastNote:null,nH:0,nS:0,lineH:{},lineS:{},rated:{},head:null})}
const label=r=>r>=.9?'Perfect!':r>=.75?'Great!':r>=.55?'Good':r>=.3?'OK':'Oops';
function simulate(sess,beat,dtb,t,H){
 for(const p of sess){const v=VOICES[p.voice];let note=null,li=-1;
  v.lines.forEach((L,idx)=>{if(beat>=L.start&&beat<L.end){li=idx;note=L.notes.find(n=>beat>=n.start&&beat<n.start+n.len)}
   if(beat>=L.end&&!p.rated[idx]&&p.lineS[idx]){p.rated[idx]=1;H.rating(p,label(p.lineH[idx]/p.lineS[idx]))}});
  if(p.lastNote&&p.lastNote!==note){H.noteDone(p,p.lastNote,p.nH/Math.max(1,p.nS));p.nH=p.nS=0}
  p.lastNote=note;
  if(p.missT>0)p.missT-=dtb;else if(Math.random()<(1-p.skill)*.05){p.missT=.8+Math.random()*2.2;p.missOff=(Math.random()<.5?-1:1)*(1.8+Math.random()*2.5)}
  if(note&&beat>note.start+.2){
   const target=note.pitch+(p.missT>0?p.missOff:0)+Math.sin(t*28+p.i*2)*.22+(Math.random()-.5)*.25;
   p.cur=p.cur==null?target-1.2:p.cur+(target-p.cur)*.3;
   const hit=Math.abs(p.cur-note.pitch)<=1;
   p.trail.push({b:beat,p:p.cur,hit});p.nS++;if(hit)p.nH++;
   p.lineS[li]=(p.lineS[li]||0)+1;if(hit)p.lineH[li]=(p.lineH[li]||0)+1;
   if(hit){p.score+=dtb*(note.gold?2:1)*v.K;if(note.gold)H.gold(p)}
   p.lastPitch=p.cur;
  }else{if(p.cur!=null)p.trail.push({b:beat,p:null});p.cur=null}
  while(p.trail.length&&p.trail[0].b<beat-60)p.trail.shift();
 }}
function makeLyrics(el,duet){const vs=duet?[0,1]:[0];
 el.innerHTML=vs.map(v=>`<div class="lyr v${v}"><div class="cur" ${duet?`style="--fill:${COL[v]}"`:''}></div><div class="nxt"></div></div>`).join('');
 const S=vs.map(v=>({v,idx:-1,cur:el.querySelector(`.v${v} .cur`),nxt:el.querySelector(`.v${v} .nxt`),spans:[]}));
 return {update(beat){for(const s of S){const lines=VOICES[s.v].lines;let idx=lines.findIndex(L=>L.end+1>beat);if(idx<0)idx=lines.length-1;
  if(idx!==s.idx){s.idx=idx;s.cur.innerHTML=lines[idx].notes.map(n=>`<span${n.gold?' class="g"':''}>${n.text.trimEnd()}</span>${/\s$/.test(n.text)?' ':''}`).join('');s.spans=[...s.cur.children];
   s.nxt.textContent=lines[idx+1]?lines[idx+1].notes.map(n=>n.text).join(''):'';s.cur.classList.remove('in');void s.cur.offsetWidth;s.cur.classList.add('in')}

/* ---------- drawing helpers ---------- */
const Y=(f,p)=>f.y+f.pad+(1-(p-f.min)/(f.max-f.min))*(f.h-2*f.pad);

function pill(c,f,n,x0,w,gone,nh=f.nh,y=Y(f,n.pitch)){if(x0>f.clipR||x0+w<f.fx)return;
 if(n.gold){const g=c.createLinearGradient(0,y-nh/2,0,y+nh/2);g.addColorStop(0,'#FFE58A');g.addColorStop(1,'#FFB020');c.fillStyle=g}else c.fillStyle=gone?'#ECEDF5':'#fff';
 c.lineWidth=nh<18?3.5:4.5;c.strokeStyle=INK;rr(c,x0,y-nh/2,w,nh,nh/2);c.fill();c.stroke();
 if(n.gold&&nh>=16){c.fillStyle='#fff';starPath(c,x0+nh/2,y,nh*.28,0);c.fill()}}
function clipBase(c,f){c.save();c.beginPath();c.rect(f.fx,f.y,f.clipR-f.fx,f.h);c.clip();
 c.strokeStyle='rgba(43,45,66,.07)';c.lineWidth=2;for(let p=Math.ceil(f.min);p<=f.max;p+=2){const y=Y(f,p);c.beginPath();c.moveTo(f.fx,y);c.lineTo(f.clipR,y);c.stroke()}}
function pitchLine(c,f,p,pt,keep){c.lineCap='round';c.lineJoin='round';let prev=null,st=null;const fl=()=>{if(st)c.stroke();st=null};
 const w=f.h<150?9:12;
 for(const q of p.trail){if(q.p==null||!keep(q.b)){fl();prev=null;continue}
  if(prev){const s=q.hit?'h':'m';if(s!==st){fl();st=s;c.strokeStyle=q.hit?COL[p.i]:'rgba(43,45,66,.22)';c.lineWidth=q.hit?w:w*.6;c.beginPath();c.moveTo(...pt(prev))}c.lineTo(...pt(q))}prev=q}fl()}
function playheadV(c,f,x){c.strokeStyle='rgba(43,45,66,.3)';c.lineWidth=5;c.lineCap='round';c.setLineDash([1,14]);c.beginPath();c.moveTo(x,f.y+12);c.lineTo(x,f.y+f.h-12);c.stroke();c.setLineDash([])}
function ball(c,x,y,r,col,s=1){c.save();c.translate(x,y);c.scale(s,1/s);c.fillStyle=col;c.strokeStyle='#fff';c.lineWidth=5;c.beginPath();c.arc(0,0,r,0,7);c.fill();c.stroke();c.restore()}
function headBall(c,f,p,x,y,S){if(p.cur!=null){ball(c,x,y,f.h<150?11:14,COL[p.i],1+.15*Math.abs(Math.sin(S.t*9+p.i)));p.head={x,y}}else if(p.lastPitch!=null)p.head={x,y}}
function sep(c,f){if(!f.sep)return;c.strokeStyle='rgba(43,45,66,.12)';c.lineWidth=3;c.beginPath();c.moveTo(f.fx-6,f.y+14);c.lineTo(f.fx-6,f.y+f.h-14);c.stroke()}
/* a horizontally scrolling lane: the round-2 A1 renderer */
function drawScroll(c,f,S){const p=f.p,X=b=>f.playX+(b-S.beat)*f.ppb;clipBase(c,f);
 for(const Ln of VOICES[f.v].lines)for(const n of Ln.notes)pill(c,f,n,X(n.start),(n.len-.2)*f.ppb,X(n.start+n.len)<f.playX);
 pitchLine(c,f,p,q=>[X(q.b),Y(f,q.p)],b=>X(b)>=f.fx-20);playheadV(c,f,f.playX);
 headBall(c,f,p,f.playX,Y(f,p.cur??p.lastPitch??f.min),S);c.restore();sep(c,f)}
/* a lane that shows one whole line at a time, with a sweeping cursor */
function drawStill(c,f,S){const p=f.p,v=VOICES[f.v];let idx=v.lines.findIndex(l=>l.end+1.2>S.beat);if(idx<0)idx=v.lines.length-1;const Ln=v.lines[idx];

function drawHighway(c,f,S){const p=f.p,v=VOICES[f.v],X=q=>f.x+26+(q-f.min)/(f.max-f.min)*(f.w-52),T=b=>f.hitY-(b-S.beat)*f.ppb,nw=clamp((f.w-52)/(f.max-f.min)*1.5,14,30);

  if(n.gold){const g=c.createLinearGradient(x-nw/2,0,x+nw/2,0);g.addColorStop(0,'#FFE58A');g.addColorStop(1,'#FFB020');c.fillStyle=g}else c.fillStyle=gone?'#ECEDF5':'#fff';
  c.lineWidth=4;c.strokeStyle=INK;rr(c,x-nw/2,yt,nw,yb-yt,nw/2);c.fill();c.stroke()}
 pitchLine(c,f,p,q=>[X(q.p),T(q.b)],b=>T(b)<=f.y+f.h+10);

   q.x+=q.vx*60*dt;q.y+=q.vy*60*dt;q.vy+=.28*60*dt;q.vx*=.99;q.rot+=q.vr;f.save();drawParticle(f,q,1-q.life/q.max);f.restore()}
  ly.update(S.beat);if(prog)prog.style.width=(S.beat/SONG_BEATS*100)+'%';
  sess.forEach((p,i)=>{p.shown+=(p.score-p.shown)*.12;hud[i].sc.textContent=fmt(p.shown)})}};
 const seek=+(P.get('seek')||0);for(let k=0;k<seek*BEAT*60;k++)ctl.tick(1/60);return ctl}

/* ---------- shell ---------- */
let ctrl=null,lastInput=0,lastAuto=0;
function mount(){ctrl=state.screen==='sing'?startSing():browser();ctrl.render&&ctrl.render();syncURL();renderBar()}
function syncURL(){const q=new URLSearchParams({variant:state.variant,screen:state.screen,players:state.players,duet:state.duet?1:0});try{history.replaceState(null,'','?'+q)}catch(e){}}
function select(i){state.sel=(i+N)%N;ctrl.render&&ctrl.render()}
function goSing(){state.screen='sing';state.duet=!!sel().d;if(state.duet&&state.players<2)state.players=2;mount()}
function cycle(d){state.variant=KEYS[(KEYS.indexOf(state.variant)+d+KEYS.length)%KEYS.length];if(state.screen==='browser')state.screen='sing';mount()}
function renderBar(){const V=VARIANTS[state.variant];$('#vl').textContent=`${state.variant} · ${V.name}`;
 document.querySelectorAll('[data-scr]').forEach(b=>b.classList.toggle('on',b.dataset.scr===state.screen));
 document.querySelectorAll('[data-pl]').forEach(b=>b.classList.toggle('on',+b.dataset.pl===(state.duet?Math.max(2,state.players):state.players)));
 $('#duet').classList.toggle('on',state.duet);
 $('#info').innerHTML=`<h4>${state.variant} · ${V.name}</h4><p>${V.info}</p>
  <p><b>Video.</b> The placeholder cuts between a sunset, a dark club and bright daylight every 6 s; "video…" plays a real file instead.</p>
  <p style="opacity:.6">Round 3 of the prototype: invented songs and simulated singers. ←/→ take · players 1–4 · Duet · Esc browser · h hide this bar.</p>`}
$('#prev').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1);
document.querySelectorAll('[data-scr]').forEach(b=>b.onclick=()=>{state.screen=b.dataset.scr;mount()});
document.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{state.players=+b.dataset.pl;if(state.players<2)state.duet=false;state.screen='sing';mount()});
$('#duet').onclick=()=>{state.duet=!state.duet;if(state.duet&&state.players<2)state.players=2;state.screen='sing';mount()};
$('#ib').onclick=()=>$('#info').classList.toggle('open');
$('#vf').onchange=e=>{const file=e.target.files[0];if(!file)return;if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(file);state.screen='sing';mount()};
stage.addEventListener('click',e=>{lastInput=performance.now();if(state.screen!=='browser')return;
 if(e.target.closest('[data-go]'))return goSing();const it=e.target.closest('[data-i]');if(!it)return;const i=+it.dataset.i;i===state.sel?goSing():select(i)});
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;lastInput=performance.now();
 if(e.key==='ArrowLeft')cycle(-1);else if(e.key==='ArrowRight')cycle(1);
 else if(e.key==='ArrowUp'&&state.screen==='browser'){e.preventDefault();select(state.sel-1)}
 else if(e.key==='ArrowDown'&&state.screen==='browser'){e.preventDefault();select(state.sel+1)}
 else if(e.key==='Enter'&&state.screen==='browser')goSing();
 else if(e.key==='Escape'&&state.screen==='sing'){state.screen='browser';mount()}
 else if(e.key==='i')$('#info').classList.toggle('open');
 else if(e.key==='h'){$('#bar').hidden=!$('#bar').hidden;$('#info').classList.remove('open')}});
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;ctrl.tick&&ctrl.tick(dt);
 if(state.screen==='browser'&&now-lastInput>6000&&now-lastAuto>2400){lastAuto=now;select(state.sel+1)}
 requestAnimationFrame(loop)}
mount();requestAnimationFrame(loop);
</script>
